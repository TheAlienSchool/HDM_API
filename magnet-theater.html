<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaGNET Theater :: HDM Intractives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080808;
      --near-white: #e8e4db;
      --gray:      #8B7D6B;
      --accent:    #c4622d;
      --accent-dim: rgba(196, 98, 45, 0.18);
      --border:    rgba(255,255,255,0.07);
      --card-bg:   rgba(255,255,255,0.025);
    }

    /* ── SKIP NAVIGATION ── */
    .skip-link {
      position: absolute; left: 0; top: -100%;
      background: var(--accent); color: #080808;
      font-family: 'DM Mono', monospace; font-size: 0.9rem;
      letter-spacing: 0.1em; padding: 0.7rem 1.4rem;
      text-decoration: none; z-index: 9999;
      border-radius: 0 0 4px 0; font-weight: 500;
    }
    .skip-link:focus { top: 0; outline: 3px solid #fff; outline-offset: 2px; }

    /* ── FOCUS RING :: visible, accent-colored, never hidden ── */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    button:focus-visible,
    a:focus-visible,
    input[type="range"]:focus-visible,
    textarea:focus-visible,
    input[type="text"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    /* ── REDUCED MOTION :: honor the vestibular system ── */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* ── MaGNET themes ── */
    body.ellian  { --accent: #C48C50; --accent-dim: rgba(196,140,80,0.15); }
    body.clops   { --accent: #7BBFCA; --accent-dim: rgba(123,191,202,0.13); }
    body.gleam   { --accent: #C8C8F0; --accent-dim: rgba(200,200,240,0.12); }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--near-white);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
      /* Dyslexia: generous line rhythm and word breathing room */
      line-height: 1.75;
      word-spacing: 0.06em;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 1000; opacity: 0.35;
    }

    /* ── GRID BACKGROUND for CLOPS ── */
    body.clops::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(123,191,202,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123,191,202,0.04) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none; z-index: 0;
    }

    /* ── LAYOUT ── */
    .theater-header {
      padding: 3rem 4rem 2rem;
      border-bottom: 1px solid var(--border);
      position: relative; z-index: 2;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 2rem; flex-wrap: wrap;
    }

    .header-left { flex: 1; }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--gray);
      margin-bottom: 0.75rem;
    }

    /* STEAM SANS: HARRIS mode — stable, expanded, resolved */
    .harris {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--near-white);
      line-height: 1;
    }

    .title-large { font-size: clamp(1.6rem, 4vw, 2.8rem); }
    .title-small { font-size: clamp(0.9rem, 2vw, 1.2rem); color: var(--accent); margin-top: 0.5rem; }

    /* STEAM SANS: HBA mode — breathing, per-character drift */
    .hba-container {
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: clamp(0.82rem, 1.5vw, 1rem);
      /* Contrast lifted: meets 4.5:1 ratio on dark bg */
      color: rgba(232,228,219,0.82);
      margin-top: 1rem;
      letter-spacing: 0.06em;
      line-height: 1.8;
    }

    .hba-char {
      display: inline-block;
      animation: hba-breathe var(--dur, 4s) ease-in-out infinite;
      animation-delay: var(--dly, 0s);
      transform-origin: bottom center;
    }
    .hba-char.sp { width: 0.32em; }

    @keyframes hba-breathe {
      0%,100% { transform: translateY(0) scaleY(1); opacity: 0.88; }
      50%      { transform: translateY(-1.5px) scaleY(1.015); opacity: 0.96; }
    }

    /* ── CHARACTER BADGE ── */
    .char-badge {
      display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
      flex-shrink: 0;
    }

    .char-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-dim);
    }

    .char-sigil {
      font-family: 'DM Mono', monospace;
      font-size: 1.2rem;
      color: var(--accent);
      opacity: 0.8;
    }

    /* ── NAV ── */
    .back-link {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: #a89880; text-decoration: none;
      border-bottom: 1px solid rgba(168,152,128,0.4);
      padding-bottom: 2px;
      transition: color 0.3s, border-color 0.3s;
      min-height: 44px; display: inline-flex; align-items: center;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); }

    /* ── DORMANT STATE ── */
    #dormant {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 80vh; text-align: center;
      padding: 4rem 2rem; gap: 1.5rem; position: relative; z-index: 2;
    }

    .dormant-sigil {
      font-size: 3rem; opacity: 0.15;
      animation: dormant-pulse 3s ease-in-out infinite;
    }
    @keyframes dormant-pulse {
      0%,100% { opacity: 0.1; } 50% { opacity: 0.22; }
    }

    .dormant-title {
      font-family: 'DM Sans', sans-serif; font-weight: 200;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      letter-spacing: 0.1em; text-transform: uppercase;
      /* Contrast: 0.3 → 0.6 for readability */
      color: rgba(232,228,219,0.6);
    }

    .dormant-sub {
      font-family: 'DM Mono', monospace; font-size: 0.85rem;
      letter-spacing: 0.12em; color: rgba(185,168,148,0.85);
    }

    /* ── THEATER BODY ── */
    #theater { display: none; position: relative; z-index: 2; }

    .section-label {
      font-family: 'DM Mono', monospace; font-size: 0.78rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent);
      padding: 2.5rem 4rem 0.5rem;
    }

    /* ── ÆQ GRID ── */
    .aeq-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1px;
      padding: 0 0 4rem;
      border-top: 1px solid var(--border);
    }

    .aeq-card {
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 2rem;
      transition: background 0.4s;
    }
    .aeq-card:hover { background: rgba(255,255,255,0.04); }

    .aeq-number {
      font-family: 'DM Mono', monospace; font-size: 0.75rem;
      letter-spacing: 0.2em; color: var(--accent); opacity: 0.85;
      margin-bottom: 0.5rem;
    }

    .aeq-title {
      font-family: 'DM Sans', sans-serif; font-weight: 300;
      font-size: 1rem; letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--near-white);
      margin-bottom: 0.4rem;
    }

    .aeq-essence {
      font-family: 'DM Mono', monospace; font-size: 0.82rem;
      /* Dyslexia: #a89880 gives sufficient contrast with line-height breathing */
      color: #a89880; line-height: 1.85;
      margin-bottom: 1.4rem;
    }

    /* ── INTERACTIVE ZONE ── */
    .intractive {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
    }

    /* Shared control styles */
    .range-label {
      font-family: 'DM Mono', monospace; font-size: 0.8rem;
      color: #a89880; display: block; margin-bottom: 0.4rem;
      letter-spacing: 0.05em;
    }

    .range-input {
      -webkit-appearance: none;
      width: 100%; height: 4px;
      background: rgba(255,255,255,0.15);
      outline: none; cursor: pointer;
      border-radius: 2px;
      /* 44px touch target via margin compensation */
      margin: 0.6rem 0;
    }
    .range-input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }
    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-dim);
    }
    .range-input::-moz-range-thumb {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent); border: none;
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-dim);
    }

    .btn {
      font-family: 'DM Mono', monospace; font-size: 0.75rem;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      /* 44px min touch target height */
      padding: 0.65rem 1.2rem; min-height: 44px;
      cursor: pointer;
      transition: all 0.3s; border-radius: 0;
    }
    .btn:hover { border-color: var(--accent); background: var(--accent-dim); }
    .btn:active { background: var(--accent-dim); border-color: var(--accent); }

    .meter-bar-wrap {
      height: 3px; background: rgba(255,255,255,0.08);
      border-radius: 1px; overflow: hidden; margin-top: 0.6rem;
    }
    .meter-bar {
      height: 100%; background: var(--accent);
      transition: width 0.6s ease;
      box-shadow: 0 0 6px var(--accent-dim);
    }

    .readout {
      font-family: 'DM Mono', monospace; font-size: 0.8rem;
      color: #a89880; margin-top: 0.5rem; line-height: 1.7;
    }
    .readout strong { color: var(--accent); }

    /* canvas defaults */
    .aeq-canvas {
      display: block; width: 100%; border-radius: 2px;
      cursor: crosshair; touch-action: none;
    }

    /* Harp strings */
    .harp-wrap { position: relative; width: 100%; height: 120px; }
    .harp-svg { width: 100%; height: 100%; overflow: visible; }
    .harp-string {
      /* Contrast: 0.25 → 0.50 so strings are visible to low-contrast readers */
      stroke: rgba(200,200,240,0.50); stroke-width: 1.5;
      fill: none; cursor: pointer;
      transition: stroke 0.2s;
    }
    .harp-string.plucked { stroke: var(--accent); animation: string-pluck 0.6s ease-out forwards; }
    @keyframes string-pluck {
      0%  { stroke: var(--accent); filter: drop-shadow(0 0 4px var(--accent)); }
      100%{ stroke: rgba(200,200,240,0.25); filter: none; }
    }

    /* Consciousness Pause steps */
    .pause-steps { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .pause-step {
      font-family: 'DM Mono', monospace; font-size: 0.78rem;
      letter-spacing: 0.12em; padding: 0.55rem 1rem;
      border: 1px solid var(--border); color: #a89880;
      transition: all 0.4s; cursor: default;
    }
    .pause-step.active {
      border-color: var(--accent); color: var(--accent);
      background: var(--accent-dim);
      box-shadow: 0 0 10px var(--accent-dim);
    }

    /* Transformation display */
    .x-equals-a {
      font-family: 'DM Sans', sans-serif; font-weight: 200;
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      letter-spacing: 0.12em; text-align: center;
      padding: 1rem 0;
      transition: all 0.8s ease;
    }
    .x-val { color: rgba(139,125,107,0.6); transition: all 0.8s; }
    .eq-mark { color: rgba(255,255,255,0.2); margin: 0 0.5rem; }
    .a-val { color: var(--accent); transition: all 0.8s; }

    /* Tile grid for ÆQ 10 */
    .tile-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
      margin-bottom: 0.8rem;
    }
    .tile {
      aspect-ratio: 1; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace; font-size: 0.9rem;
      cursor: pointer; transition: all 0.2s;
      color: var(--near-white); min-height: 44px;
    }
    .tile.selected { border-color: var(--accent); background: var(--accent-dim); }
    /* Correct: border pattern + color (not color-only, accessible) */
    .tile.correct  {
      border: 2px solid rgba(100,220,100,0.6);
      background: rgba(100,220,100,0.06);
      color: rgba(140,230,150,0.9);
    }

    /* Cascade viz */
    .cascade-row {
      display: flex; gap: 8px; align-items: center; margin-bottom: 6px;
    }
    .cascade-dot {
      /* Enlarged from 10px → 14px for better visibility */
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
      transition: all 0.4s; flex-shrink: 0;
    }
    .cascade-dot.lit {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-dim);
      border-color: var(--accent);
    }

    /* Recognition text area */
    .recognition-input {
      width: 100%; background: transparent;
      border: none; border-bottom: 1px solid rgba(255,255,255,0.15);
      color: var(--near-white); font-family: 'DM Mono', monospace;
      /* Dyslexia: 0.9rem minimum for input fields */
      font-size: 0.9rem; padding: 0.5rem 0;
      outline: none; resize: none; line-height: 1.8;
    }
    .recognition-input:focus {
      border-bottom-color: var(--accent);
      outline: none;
    }
    .recognition-input::placeholder { color: rgba(168,152,128,0.55); }

    /* Presence field rings */
    .presence-rings {
      position: relative; width: 100%; height: 120px;
      display: flex; align-items: center; justify-content: center;
    }
    .p-ring {
      position: absolute; border-radius: 50%;
      border: 1px solid var(--accent);
      animation: ring-pulse 3s ease-in-out infinite;
    }
    @keyframes ring-pulse {
      0%,100% { opacity: 0.08; transform: scale(1); }
      50%      { opacity: 0.22; transform: scale(1.04); }
    }

    /* Translucency demo */
    .translu-row {
      display: flex; align-items: center; gap: 1rem; margin-top: 0.8rem;
    }
    .translu-word {
      font-family: 'DM Sans', sans-serif; font-weight: 300;
      font-size: 1.4rem; letter-spacing: 0.12em; text-transform: uppercase;
      transition: opacity 0.6s, filter 0.6s;
    }

    /* Frequency noise text */
    .freq-text {
      font-family: 'DM Mono', monospace; font-size: 0.88rem;
      letter-spacing: 0.08em; line-height: 1.8;
      color: var(--near-white);
      min-height: 60px;
    }

    /* Footer */
    .theater-footer {
      border-top: 1px solid var(--border);
      padding: 2rem 4rem;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
      position: relative; z-index: 2;
    }

    .footer-brand {
      font-family: 'DM Mono', monospace; font-size: 0.75rem;
      letter-spacing: 0.15em; text-transform: uppercase; color: #a89880;
    }

    /* scroll bar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(139,125,107,0.25); border-radius: 2px; }

    @media (max-width: 600px) {
      .theater-header { padding: 2rem 1.5rem; }
      .section-label  { padding: 2rem 1.5rem 0.5rem; }
      .theater-footer { padding: 1.5rem; }
      /* Grid hidden on mobile — swipe stage takes over */
      .aeq-grid       { display: none; }
      .section-label  { display: none; }
    }

    /* ── MOBILE SWIPE STAGE ─────────────────────────────────── */
    .aeq-stage { display: none; }

    @media (max-width: 600px) {
      .aeq-stage { display: block; }

      .stage-nav {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.8rem 1.5rem;
        border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 10;
        background: rgba(8,8,8,0.95); backdrop-filter: blur(8px);
      }

      .stage-btn {
        font-family: 'DM Mono', monospace; font-size: 0.75rem;
        letter-spacing: 0.12em; color: var(--accent);
        background: transparent; border: 1px solid var(--border);
        padding: 0.65rem 1rem; cursor: pointer; transition: all 0.2s;
        min-width: 72px; min-height: 44px; text-align: center;
      }
      .stage-btn:disabled { color: rgba(139,125,107,0.25); border-color: transparent; pointer-events: none; }
      .stage-btn:not(:disabled):active { border-color: var(--accent); background: var(--accent-dim); }

      .stage-counter {
        font-family: 'DM Mono', monospace; font-size: 0.78rem;
        letter-spacing: 0.14em; color: #a89880; text-align: center; flex: 1;
      }
      .stage-counter strong { color: var(--accent); }

      .stage-card {
        padding: 1.8rem 1.5rem 2.5rem;
        min-height: calc(100dvh - 120px);
        display: none; flex-direction: column;
        border-bottom: 1px solid var(--border);
        animation: card-in 0.3s ease;
      }
      .stage-card.active { display: flex; }

      @keyframes card-in {
        from { opacity: 0; transform: translateX(20px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      .stage-card .intractive { flex: 1; padding-top: 1.2rem; border-top: 1px solid var(--border); }
      .stage-card .aeq-canvas { height: 160px !important; }
      .stage-card .harp-wrap  { height: 140px !important; }
      .stage-card .presence-rings { height: 140px !important; }
      .stage-card .harp-svg   { height: 140px !important; }

      /* Bigger touch targets */
      .stage-card .btn { padding: 0.75rem 1.4rem; font-size: 0.64rem; min-height: 44px; }
      .stage-card .range-input { height: 4px; margin: 0.5rem 0; }
      .stage-card .range-input::-webkit-slider-thumb { width: 22px; height: 22px; }
      .stage-card .recognition-input { font-size: 0.8rem; }

      /* Progress dots */
      .stage-dots {
        display: flex; gap: 5px; justify-content: center;
        padding: 1rem 0 0.5rem;
      }
      .stage-dot {
        width: 5px; height: 5px; border-radius: 50%;
        background: var(--border); transition: background 0.3s, transform 0.3s;
        flex-shrink: 0;
      }
      .stage-dot.active { background: var(--accent); transform: scale(1.4); }
    }
  </style>
</head>
<body>

<a href="#dormant" class="skip-link" id="skip-link">Skip to main content</a>

<!-- ── DORMANT STATE ───────────────────────────────────────────────── -->
<main id="dormant" role="main" tabindex="-1">
  <div class="dormant-sigil" aria-hidden="true">◎</div>
  <h1 class="dormant-title">MaGNET Theater</h1>
  <p class="dormant-sub">Introduce a MaGNET at the hub to enter the field.</p>
  <a href="index.html" class="back-link" style="margin-top:1rem;" aria-label="Return to Hub">← Return to Hub</a>
</main>

<!-- ── ACTIVE THEATER ─────────────────────────────────────────────── -->
<div id="theater" role="main" tabindex="-1">

  <header class="theater-header">
    <div class="header-left">
      <p class="eyebrow" aria-label="Section: MaGNET Theater, Human Development Mathematics">MaGNET Theater :: Human Development Mathematics</p>
      <h1 class="harris title-large" id="theater-title">—</h1>
      <p class="harris title-small" id="theater-desc">—</p>
      <div class="hba-container" id="theater-essence"
           aria-live="polite" aria-label="Character essence"></div>
    </div>
    <div class="char-badge">
      <img class="char-avatar" id="char-img" src="" alt="" />
      <div class="char-sigil" id="char-sigil" aria-hidden="true">◉</div>
      <a href="index.html" class="back-link" id="back-link" aria-label="Return to Hub">← Hub</a>
    </div>
  </header>

  <!-- ÆQs injected here by JS -->
  <div id="aeq-mount"></div>

  <footer class="theater-footer">
    <div class="footer-brand" aria-label="The Alien School, Human Development Mathematics, Intractives">THE ÅĻÏEN SCÖÕL · Human Development Mathematics · Intractives</div>
    <a href="index.html" class="back-link" id="back-link-footer" aria-label="Return to Hub">← Return to Hub</a>
  </footer>

</div><!-- /theater -->

<script>
/* ═══════════════════════════════════════════════════════════════════
   STEAM SANS :: THEATER ENGINE
   ═══════════════════════════════════════════════════════════════════ */

// ── 1. Resolve MaGNET key ────────────────────────────────────────────
function resolveKey(raw) {
  if (!raw) return null;
  const r = raw.toLowerCase().trim();
  if (r === 'ellian' || r === '6388') return 'ellian';
  if (r === 'clops'  || r === 'curator' || r === '6394') return 'clops';
  if (r === 'gleam'  || r === 'magnific' || r === '6391') return 'gleam';
  return null;

// ── 3. STEAM SANS :: HBA builder ─────────────────────────────────────
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildHBA(text, container) {
  container.innerHTML = '';
  // Screen readers get the plain text; sighted users get the breathing animation
  container.setAttribute('aria-label', text);
  [...text].forEach((ch, i) => {
    if (ch === ' ') {
      const s = document.createElement('span');
      s.className = 'hba-char sp'; s.setAttribute('aria-hidden','true');
      container.appendChild(s); return;
    }
    const s = document.createElement('span');
    s.className = 'hba-char';
    s.textContent = ch;
    s.setAttribute('aria-hidden', 'true');
    if (!prefersReducedMotion) {
      const dur = (3.5 + Math.random() * 2.5).toFixed(2);
      const dly = (i * 0.09 + Math.random() * 0.07).toFixed(2);
      s.style.setProperty('--dur', dur + 's');
      s.style.setProperty('--dly', dly + 's');
    }
    container.appendChild(s);
  });
}

// ── 4. STEAM SANS :: Vapor particle system ───────────────────────────
class Vapor {
  constructor(canvas, opts = {}) {
    this.c   = canvas;
    this.ctx = canvas.getContext('2d');
    this.o   = Object.assign({ fs: 80, fw: '300', gap: 3, scatter: 250, speed: 0.07, color: '#e8e4db' }, opts);
    this.ps  = [];
    this.state = 'scattered';
    this._resize();
    this._loop();
  }
  _resize() {
    const r = this.c.getBoundingClientRect();
    this.W = r.width || 400; this.H = r.height || 80;
    this.c.width  = this.W * devicePixelRatio;
    this.c.height = this.H * devicePixelRatio;
    this.ctx.scale(devicePixelRatio, devicePixelRatio);
  }
  setText(text) {
    this.ps = [];
    const off = document.createElement('canvas');
    off.width = this.W; off.height = this.H;
    const oc = off.getContext('2d');
    oc.font = `${this.o.fw} ${this.o.fs}px DM Sans`;
    oc.fillStyle = '#fff'; oc.textBaseline = 'middle';
    const m = oc.measureText(text);
    oc.fillText(text, (this.W - m.width) / 2, this.H / 2);
    const d = oc.getImageData(0, 0, this.W, this.H).data;
    const g = this.o.gap;
    for (let y = 0; y < this.H; y += g)
      for (let x = 0; x < this.W; x += g)
        if (d[(y * this.W + x) * 4 + 3] > 100) {
          const sc = this.o.scatter;
          this.ps.push({
            hx: x, hy: y,
            x: x + (Math.random()-.5)*sc*2, y: y + (Math.random()-.5)*sc*2,
            tx: x + (Math.random()-.5)*sc*2, ty: y + (Math.random()-.5)*sc*2,
            sz: Math.random()*1.2+0.4, op: Math.random()*0.5+0.3,
            sp: this.o.speed + Math.random()*0.04,
          });
        }
  }
  form()    { this.state='forming'; this.ps.forEach(p=>{p.tx=p.hx;p.ty=p.hy;}); }
  dissolve(){ this.state='dissolving'; const sc=this.o.scatter*3; this.ps.forEach(p=>{p.tx=p.hx+(Math.random()-.5)*sc;p.ty=p.hy+(Math.random()-.5)*sc;}); }
  _loop() {
    requestAnimationFrame(()=>this._loop());
    const ctx=this.ctx;
    ctx.clearRect(0,0,this.W,this.H);
    this.ps.forEach(p=>{
      p.x+=(p.tx-p.x)*p.sp; p.y+=(p.ty-p.y)*p.sp;
      if(this.state==='forming'){p.x+=(Math.random()-.5)*.3;p.y+=(Math.random()-.5)*.3;}
      const dist=Math.hypot(p.x-p.tx,p.y-p.ty);
      const alpha=this.state==='dissolving'?Math.min(1,dist/50)*p.op:p.op;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);
      ctx.fillStyle=`rgba(232,228,219,${alpha})`; ctx.fill();
    });
  }
}

function renderTheater(key) {
  const m = MAGNETS[key];
  if (!m) return;

  document.body.classList.add(key);
  document.getElementById('dormant').style.display = 'none';

  const theaterEl = document.getElementById('theater');
  theaterEl.style.display = 'block';
  // Move skip link target to the active theater content
  document.getElementById('skip-link').href = '#theater';
  // Shift focus to the theater landmark on activation
  theaterEl.focus();

  document.title = 'MaGNET Theater :: ' + m.name;
  document.getElementById('theater-title').textContent  = m.name;
  document.getElementById('theater-desc').textContent   = m.desc;
  buildHBA(m.essence, document.getElementById('theater-essence'));

  const img = document.getElementById('char-img');
  img.src = m.img;
  img.alt = m.name + ' character portrait';
  document.getElementById('char-sigil').textContent = m.sigil;

  const hubURL = `index.html?magnet=${key}`;
  document.getElementById('back-link').href = hubURL;
  document.getElementById('back-link-footer').href = hubURL;

}

// ── 7. Mobile Swipe Stage ────────────────────────────────────────────
function renderMobileStage(aeqs) {
  const mount = document.getElementById('aeq-mount');

  const stage = document.createElement('div');
  stage.className = 'aeq-stage';

  // Nav
  const nav = document.createElement('div');
  nav.className = 'stage-nav';
  nav.innerHTML = `<button class="stage-btn" id="stage-prev">← Prev</button>
    <div class="stage-counter"><strong id="stage-cur">1</strong> / <strong>${aeqs.length}</strong></div>
    <button class="stage-btn" id="stage-next">Next →</button>`;
  stage.appendChild(nav);

  // Cards
  aeqs.forEach((aeq, i) => {
    const card = document.createElement('div');
    card.className = 'stage-card' + (i===0?' active':'');
    card.id = 'sc-'+i;
    card.innerHTML = `<div class="aeq-number">${aeq.n}</div>
      <div class="aeq-title harris">${aeq.title}</div>
      <div class="aeq-essence">${aeq.essence}</div>
      <div class="intractive">${aeq.html}</div>`;
    stage.appendChild(card);
  });

  // Dots
  const dotsEl = document.createElement('div');
  dotsEl.className = 'stage-dots';
  aeqs.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='stage-dot'+(i===0?' active':'');
    dotsEl.appendChild(d);
  });
  stage.appendChild(dotsEl);
  mount.appendChild(stage);

  // Init ÆQs
  aeqs.forEach(aeq=>{ try{aeq.init();}catch(e){console.warn(aeq.n,e);} });

  // Navigation state
  let cur=0;
  const cards=[...stage.querySelectorAll('.stage-card')];
  const dots=[...stage.querySelectorAll('.stage-dot')];
  const prevBtn=document.getElementById('stage-prev');
  const nextBtn=document.getElementById('stage-next');
  const curEl=document.getElementById('stage-cur');

  function goto(n) {
    cards[cur].classList.remove('active');
    dots[cur].classList.remove('active');
    cur=n;
    cards[cur].classList.add('active');
    dots[cur].classList.add('active');
    curEl.textContent=cur+1;
    prevBtn.disabled=cur===0;
    nextBtn.disabled=cur===cards.length-1;
    window.scrollTo({top:0,behavior:'smooth'});
  }

  prevBtn.disabled=true;
  nextBtn.disabled=cards.length<=1;
  prevBtn.addEventListener('click',()=>{ if(cur>0) goto(cur-1); });
  nextBtn.addEventListener('click',()=>{ if(cur<cards.length-1) goto(cur+1); });

  // Touch swipe between cards
  let tx0,ty0;
  stage.addEventListener('touchstart',e=>{ tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; },{passive:true});
  stage.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx0;
    const dy=e.changedTouches[0].clientY-ty0;
    // Only fire if horizontal swipe dominates AND canvas is not the target
    if(e.target.tagName==='CANVAS') return;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){
      if(dx<0&&cur<cards.length-1) goto(cur+1);
      else if(dx>0&&cur>0) goto(cur-1);
    }
  },{passive:true});
}

  if (window.innerWidth <= 600) {

    // Desktop: build grid
    const mount = document.getElementById('aeq-mount');
    const perKey = { ellian: 'ELLIAN · Warmth Field', clops: 'CLOPS · Blueprint Grid', gleam: 'GLEAM · Ether Field' };
    mount.innerHTML = `<p class="section-label">${perKey[KEY]||''} · ${aeqs.length-1} Character Intractives + 1 Universal</p>`;
    const grid = document.createElement('div');
    grid.className = 'aeq-grid';
    aeqs.forEach(aeq => {
      const card = document.createElement('div');
      card.className = 'aeq-card';
      card.innerHTML = `<div class="aeq-number">${aeq.n}</div>
        <div class="aeq-title harris">${aeq.title}</div>
        <div class="aeq-essence">${aeq.essence}</div>
        <div class="intractive">${aeq.html}</div>`;
      grid.appendChild(card);
    });
    mount.appendChild(grid);
    aeqs.forEach(aeq=>{ try{aeq.init();}catch(e){console.warn(aeq.n,e);} });
  }
} else {
  document.getElementById('dormant').style.display = 'flex';
}
</script>
</body>
</html>
