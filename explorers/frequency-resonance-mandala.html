<script>
(function() {
  'use strict';

  let booted = false;
  let micBtn, mandalaCanvas, mandalaCtx, freqDisplay, lockLabel, mandalaUI, btnReinit, btnCapture;

  let animFrame = null;

  let simulationStartTime = null;

  const baseRad = 55;
  const PETALS = 12;
  const POINTS = 32;
  const segAngle = (2 * Math.PI) / PETALS;

  let maxBin = 74;

  function boot() {
    if (booted) return;
    booted = true;
    init();
  }

  function init() {
    micBtn = document.getElementById('mic-trigger');
    mandalaCanvas = document.getElementById('mandala-canvas');
    mandalaCtx = mandalaCanvas.getContext('2d');
    freqDisplay = document.getElementById('freq-display');
    lockLabel = document.getElementById('lock-label');
    mandalaUI = document.getElementById('mandala-ui');
    btnReinit = document.getElementById('btn-reinit');
    btnCapture = document.getElementById('btn-capture');

    activeMagnet = localStorage.getItem('active_magnet') || 'ellian';
    sigil = activeMagnet === 'curator' ? '❂' : activeMagnet === 'gleam' ? '✦' : '◈';

    micBtn.addEventListener('click', onMicClick);
    btnReinit.addEventListener('click', onReinitClick);
    btnCapture.addEventListener('click', onCaptureClick);
  }

  // BODY <250 Hz → terra, HEART 250–800 Hz → gold, MIND >800 Hz → luna
  function getBand(hz) {
    if (hz < 250) return { color: 'rgba(196,98,45,', label: 'BODY' };
    if (hz < 800) return { color: 'rgba(196,140,80,', label: 'HEART' };
    return { color: 'rgba(253,251,226,', label: 'MIND' };
  }

  async function onMicClick() {
    if (isTraceLocked) return;

    if (isSimulationMode) {
      startSimulationResonance();
      return;
    }

    try {
      if (!analyzerCtx) analyzerCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (analyzerCtx.state === 'suspended') analyzerCtx.resume();

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = analyzerCtx.createMediaStreamSource(stream);
      analyser = analyzerCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.75;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount); // 128 bins

      micBtn.textContent = '[ RESONANCE DETECTED · DRAWING TRACE ]';
      micBtn.style.color = 'var(--gold)';
      micBtn.style.borderColor = 'var(--gold)';
      mandalaUI.style.opacity = '0.06';

      drawMandala();

      setTimeout(() => {
        stream.getTracks().forEach(t => t.stop());
        isTraceLocked = true;
        if (animFrame) cancelAnimationFrame(animFrame);
        
        micBtn.style.display = 'none';
        document.getElementById('locked-actions').style.display = 'flex';
        
        freqDisplay.innerHTML = `<span style="margin-right: 6px; font-size: 16px;">${sigil}</span> · GEOMETRY FROZEN ·`;
        freqDisplay.style.color = 'var(--terra)';
        lockLabel.style.opacity = '1';

        // Post-lock: Solfeggio chord :: one breath, then silence
        [396, 528, 639].forEach(freq => {
          const osc  = analyzerCtx.createOscillator();
          const gain = analyzerCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, analyzerCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.12, analyzerCtx.currentTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, analyzerCtx.currentTime + 3.5);
          osc.connect(gain);
          gain.connect(analyzerCtx.destination);
          osc.start(analyzerCtx.currentTime);
          osc.stop(analyzerCtx.currentTime + 3.55);
        });

        // Post-lock: reveal integration annotation in math-note
        const mathNote = document.getElementById('math-note');
        while (mathNote.firstChild) mathNote.removeChild(mathNote.firstChild);
        mathNote.style.color = 'rgba(196,140,80,0.5)';

        const pre = document.createTextNode('what you traced is integration :: accumulated form · ');
        mathNote.appendChild(pre);

        const eq = document.createElement('span');
        eq.className = 'frm-tip';
        eq.tabIndex = 0;
        eq.textContent = '∫ f(x)dx = F(x) + C';
        eq.dataset.frmTitle    = 'Wholeness from accumulation';
        eq.dataset.frmLiteral  = 'An antiderivative F is related to the integral of f, up to a constant C.';
        eq.dataset.frmHuman    = 'Small moments accumulate into the shape of a life; the whole is built from many local choices. Your voice, gathered across 7 seconds of resonance, is F(x): the whole formed from every frequency you carried.';
        eq.dataset.frmValidity = 'Mathematically valid; metaphor is widely understandable.';
        eq.dataset.frmGuardrail = 'The constant of integration marks a family of solutions :: the starting awareness, mathematically bounded.';
        mathNote.appendChild(eq);
      }, 7000);

    } catch (err) {
      console.warn("Microphone access failed. Offering Procedural Resonance simulation fallback.", err);
      isSimulationMode = true;
      micBtn.textContent = '[ MIC ACCESS REQUIRED · SIMULATE RESONANCE ]';
      micBtn.style.color = 'var(--gold)';
      micBtn.style.borderColor = 'var(--gold)';
    }
  }

  function startSimulationResonance() {
    if (!analyzerCtx) analyzerCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (analyzerCtx.state === 'suspended') analyzerCtx.resume();

    // Create virtual dataArray
    dataArray = new Uint8Array(128); // 128 bins
    simulationStartTime = performance.now();

    micBtn.textContent = '[ PROCEDURAL SWEEP · GENERATING RESONANCE ]';
    micBtn.style.color = 'var(--gold)';
    micBtn.style.borderColor = 'var(--gold)';
    mandalaUI.style.opacity = '0.06';

    drawMandala();

    setTimeout(() => {
      isTraceLocked = true;
      if (animFrame) cancelAnimationFrame(animFrame);
      
      micBtn.style.display = 'none';
      document.getElementById('locked-actions').style.display = 'flex';
      
      freqDisplay.innerHTML = `<span style="margin-right: 6px; font-size: 16px;">${sigil}</span> · PROCEDURAL TRACE INTEGRATED ·`;
      freqDisplay.style.color = 'var(--terra)';

        const osc  = analyzerCtx.createOscillator();
        const gain = analyzerCtx.createGain();

        osc.frequency.value = freq;

        gain.gain.linearRampToValueAtTime(0.12, analyzerCtx.currentTime + 0.04);

        osc.connect(gain);
        gain.connect(analyzerCtx.destination);
        osc.start(analyzerCtx.currentTime);
        osc.stop(analyzerCtx.currentTime + 3.55);
      });

      // Post-lock: reveal integration annotation in math-note
      const mathNote = document.getElementById('math-note');
      while (mathNote.firstChild) mathNote.removeChild(mathNote.firstChild);
      mathNote.style.color = 'rgba(196,140,80,0.5)';

      const pre = document.createTextNode('what you traced is integration :: accumulated form · ');
      mathNote.appendChild(pre);

      const eq = document.createElement('span');
      eq.className = 'frm-tip';
      eq.tabIndex = 0;
      eq.textContent = '∫ f(x)dx = F(x) + C';
      eq.dataset.frmTitle    = 'Wholeness from accumulation';
      eq.dataset.frmLiteral  = 'An antiderivative F is related to the integral of f, up to a constant C.';
      eq.dataset.frmHuman    = 'Small moments accumulate into the shape of a life; the whole is built from many local choices. Traced via 7 seconds of mathematical resonance, F(x) represents the procedural whole.';
      eq.dataset.frmValidity = 'Mathematically valid; metaphor is widely understandable.';
      eq.dataset.frmGuardrail = 'The constant of integration marks a family of solutions :: the starting awareness, mathematically bounded.';
      mathNote.appendChild(eq);
    }, 7000);
  }

  function onReinitClick() {
      mandalaCtx.clearRect(0, 0, 400, 400); 
      isTraceLocked = false;
      simulationStartTime = null;
      document.getElementById('locked-actions').style.display = 'none';
      micBtn.style.display = 'block';
      
      if (isSimulationMode) {
          micBtn.textContent = '[ MIC ACCESS REQUIRED · SIMULATE RESONANCE ]';
          micBtn.style.color = 'var(--gold)';
          micBtn.style.borderColor = 'var(--gold)';
      } else {
          micBtn.textContent = '[ INITIATE RESONANCE · ENGAGE MIC ]';
          micBtn.style.color = 'var(--gold)';
          micBtn.style.borderColor = 'rgba(196,140,80,0.4)';
      }
      
      mandalaUI.style.opacity = '1';
      lockLabel.style.opacity = '0';
      freqDisplay.textContent = '· · ·';
      freqDisplay.style.color = 'var(--ink)';
  }

  function onCaptureClick() {
      const xCnv = document.createElement('canvas');
      xCnv.width = 1000;
      xCnv.height = 1100;
      const x = xCnv.getContext('2d');
      x.scale(2.5, 2.5);

      x.fillStyle = '#0B0B0B';
      x.fillRect(0, 0, 400, 440);

      x.save();
      x.translate(0, 10);
      x.strokeStyle = 'rgba(196,98,45,0.15)';
      x.lineWidth = 1;
      x.beginPath();
      x.arc(200, 200, 160, 0, Math.PI*2);
      for(let i=0; i<6; i++) {
        let ang = i * Math.PI/6;
        x.moveTo(200 + Math.cos(ang)*200, 200 + Math.sin(ang)*200);
        x.lineTo(200 - Math.cos(ang)*200, 200 - Math.sin(ang)*200);
      }
      x.stroke();
      x.setLineDash([3, 6]); x.strokeStyle = 'rgba(196,98,45,0.06)';
      x.beginPath(); x.arc(200, 200, 55, 0, Math.PI*2); x.stroke();
      x.setLineDash([2, 8]); x.strokeStyle = 'rgba(196,98,45,0.035)';
      x.beginPath(); x.arc(200, 200, 105, 0, Math.PI*2); x.stroke();
      x.restore();

      x.drawImage(mandalaCanvas, 0, 10, 400, 400);

    if (isTraceLocked) return;
    animFrame = requestAnimationFrame(drawMandala);
    
    if (isSimulationMode) {
      if (!simulationStartTime) simulationStartTime = performance.now();
      const elapsed = (performance.now() - simulationStartTime) / 1000;
      for (let i = 0; i < dataArray.length; i++) {
          const f = 80 + i * (3200 / dataArray.length);
          const peak1 = 300 + 500 * Math.sin(elapsed * Math.PI / 3.5);
          const peak2 = 1200 + 800 * Math.cos(elapsed * Math.PI / 4.5);
          
          const noise = (Math.sin(elapsed * 45 + i) * Math.cos(elapsed * 23 - i) * 0.5 + 0.5) * 22;
          
          let amp1 = Math.exp(-Math.pow(f - peak1, 2) / (2 * Math.pow(80, 2))) * 230;
          let amp2 = Math.exp(-Math.pow(f - peak2, 2) / (2 * Math.pow(150, 2))) * 180;
          
          let bodyWarmth = Math.exp(-Math.pow(f - 150, 2) / (2 * Math.pow(40, 2))) * 110 * (1 + 0.3 * Math.sin(elapsed * 12));
          
          dataArray[i] = Math.min(255, Math.max(0, Math.floor(amp1 + amp2 + bodyWarmth + noise)));
      }
    } else {
      analyser.getByteFrequencyData(dataArray);
    }

    const sampleRate = analyzerCtx ? analyzerCtx.sampleRate : 44100;
    const binHz = isSimulationMode ? (22050 / 128) : (sampleRate / analyser.fftSize);

    const binSpan = maxBin - minBin;

    let bodySum = 0, heartSum = 0, mindSum = 0;
    let bodyN = 0, heartN = 0, mindN = 0;

    // Draw the 12-petal form with bilateral symmetry per petal
    mandalaCtx.beginPath();
    for (let petal = 0; petal < PETALS; petal++) {
      const baseAngle = petal * segAngle - Math.PI / 2;
      for (let p = 0; p <= POINTS; p++) {
        const mp = p <= POINTS / 2 ? p : POINTS - p; // bilateral fold
        const t = mp / (POINTS / 2);
        const bin = Math.min(minBin + Math.floor(t * binSpan), dataArray.length - 1);
        const val = dataArray[bin];
        const hz = bin * binHz;

        if (hz < 250) { bodySum += val; bodyN++; }
        else if (hz < 800) { heartSum += val; heartN++; }
        else { mindSum += val; mindN++; }

        const r = baseRad + val * 0.4;
        const angle = baseAngle + (p / POINTS) * segAngle;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (p === 0 && petal === 0) mandalaCtx.moveTo(x, y);
        else mandalaCtx.lineTo(x, y);
      }
    }
    mandalaCtx.closePath();

    const bodyAvg = bodyN > 0 ? bodySum / bodyN : 0;
    const heartAvg = heartN > 0 ? heartSum / heartN : 0;
    const mindAvg = mindN > 0 ? mindSum / mindN : 0;

    let strokeColor, label;
    if (bodyAvg >= heartAvg && bodyAvg >= mindAvg) {
      strokeColor = 'rgba(196,98,45,0.7)'; label = 'BODY';
    } else if (heartAvg >= mindAvg) {
      strokeColor = 'rgba(196,140,80,0.7)'; label = 'HEART';
    } else {
      strokeColor = 'rgba(253,251,226,0.5)'; label = 'MIND';
    }

    mandalaCtx.strokeStyle = strokeColor;
    mandalaCtx.lineWidth = 1.2;
    mandalaCtx.stroke();

    // Dot markers at energy peaks
    for (let petal = 0; petal < PETALS; petal++) {
      const baseAngle = petal * segAngle - Math.PI / 2;
      for (let p = 0; p <= POINTS; p++) {
        const mp = p <= POINTS / 2 ? p : POINTS - p;
        const t = mp / (POINTS / 2);
        const bin = Math.min(minBin + Math.floor(t * binSpan), dataArray.length - 1);
        const val = dataArray[bin];
        if (val > 180) {
          const hz = bin * binHz;
          const { color } = getBand(hz);
          const r = baseRad + val * 0.4;
          const angle = baseAngle + (p / POINTS) * segAngle;
          mandalaCtx.fillStyle = color + '0.5)';
          mandalaCtx.fillRect(
            cx + Math.cos(angle) * r - 0.8,
            cy + Math.sin(angle) * r - 0.8,
            1.6, 1.6
          );
        }
      }
    }

    const energy = (bodyAvg + heartAvg + mindAvg) / 3;
    if (energy > 5) {
      freqDisplay.innerHTML = `<span style="margin-right: 6px; font-size: 16px;">${sigil}</span> ${label} · ${Math.round(energy)}`;
      freqDisplay.style.color =
        label === 'BODY' ? '#C4622D' :
        label === 'HEART' ? '#C48C50' : '#FDFBE2';
    } else {
      freqDisplay.textContent = '· · ·';
      freqDisplay.style.color = 'rgba(138,125,113,0.4)';
    }
  }

  // Global Teardown Registration
  window.hdmPageUnload = function () {
    console.log(":: Frequency Resonance Mandala :: Triggering page unload teardown");
    if (animFrame) {
      cancelAnimationFrame(animFrame);
      animFrame = null;
    }
    if (analyzerCtx) {
      try {
        analyzerCtx.close();
      } catch (e) {}
      analyzerCtx = null;
    }
    try {
      if (typeof Tone !== 'undefined') {
        Tone.Transport.stop();
        Tone.Transport.cancel();
      }
    } catch (e) {
      console.warn(":: Frequency Resonance Mandala :: Tone reset error:", e);
    }
  };

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    boot();
  } else {
    window.addEventListener('load', boot, { once: true });
    document.addEventListener('hdm:page-loaded', boot, { once: true });
  }
})();
</script>

<!-- Integration formula tooltip -->
<div id="frm-tooltip" role="tooltip" aria-hidden="true"></div>
<script>
(function() {
  'use strict';
  const tt  = document.getElementById('frm-tooltip');
  let hideT = null;

  function mk(cls, text) {
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = text;
    return el;
  }

  function show(anchor) {
    clearTimeout(hideT);
    const d = anchor.dataset;
    while (tt.firstChild) tt.removeChild(tt.firstChild);

    tt.appendChild(mk('frm-formula', anchor.textContent.trim()));
    tt.appendChild(mk('frm-title',   d.frmTitle || ''));
    if (d.frmLiteral)  tt.appendChild(mk('frm-literal',  d.frmLiteral));
    if (d.frmHuman)    tt.appendChild(mk('frm-human',    d.frmHuman));
    if (d.frmValidity || d.frmGuardrail) {
      tt.appendChild(mk('frm-sep', ''));
      if (d.frmValidity)   tt.appendChild(mk('frm-validity',   d.frmValidity));
      if (d.frmGuardrail)  tt.appendChild(mk('frm-guardrail',  d.frmGuardrail));
    }

    tt.setAttribute('aria-hidden', 'false');
    const r = anchor.getBoundingClientRect();
    const margin = 14;
    let left = Math.min(r.left, window.innerWidth - 354);
    left = Math.max(margin, left);
    let top = r.top - 320;
    if (top < margin) top = r.bottom + 10;
    tt.style.top  = top  + 'px';
    tt.style.left = left + 'px';
    tt.classList.add('visible');
  }

  function hide() {
    hideT = setTimeout(() => {
      tt.classList.remove('visible');
      tt.setAttribute('aria-hidden', 'true');
    }, 130);
  }

  const onPointerOver = e => { const el = e.target.closest('.frm-tip'); if (el) show(el); };
  const onPointerOut  = e => { if (e.target.closest('.frm-tip')) hide(); };
  const onFocusIn     = e => { const el = e.target.closest('.frm-tip'); if (el) show(el); };
  const onFocusOut    = e => { if (e.target.closest('.frm-tip')) hide(); };

  document.addEventListener('pointerover', onPointerOver);
  document.addEventListener('pointerout',  onPointerOut);
  document.addEventListener('focusin',     onFocusIn);
  document.addEventListener('focusout',    onFocusOut);

  // Chain window.hdmPageUnload to cleanly remove document event listeners
  const originalUnload = window.hdmPageUnload;
  window.hdmPageUnload = function() {
    if (typeof originalUnload === 'function') {
      try {
        originalUnload();
      } catch (e) {}
    }
    document.removeEventListener('pointerover', onPointerOver);
    document.removeEventListener('pointerout',  onPointerOut);
    document.removeEventListener('focusin',     onFocusIn);
    document.removeEventListener('focusout',    onFocusOut);
    console.log(":: Frequency Resonance Mandala Tooltips :: Removed event listeners");
  };
})();
</script>
