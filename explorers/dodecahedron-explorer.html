  <style>
    /* ── DESIGN TOKENS ─────────────────────────────────────────── */
    :root {
      --void:       #0D0907;
      --charcoal:   #1E1610;
      --sand:       #F0E6D2;
      --sand-mid:   #E8D9BC;
      --terra:      #C4622D;
      --gold:       #C48C50;
      --ink-light:  #B8A890;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-fell:    'IM Fell English', Georgia, serif;
      --font-body:    'Inter', 'Helvetica Neue', sans-serif;
      --ease-out:   cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--void);
      color: var(--sand);
      font-family: var(--font-body);
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.8s var(--ease-out);
    }
    body.is-loaded { opacity: 1; }

    /* ── NAV ───────────────────────────────────────────────────── */
    .breadcrumb-nav {
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      background: rgba(13,9,7,0.93);
      padding: 0 20px;
      border-bottom: 1px solid rgba(196,98,45,0.15);
      z-index: 1000;
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--ink-light); letter-spacing: 0.06em;
    }
    .nav-breadcrumb { display: flex; align-items: center; gap: 0; }
    .nav-breadcrumb a {
      color: var(--terra); text-decoration: none; transition: color 0.2s;
    }
    .nav-breadcrumb a:hover { color: var(--gold); }
    .nav-sep { color: var(--terra); opacity: 0.4; margin: 0 8px; }
    .nav-current { color: var(--sand); }

    .nav-controls { display: flex; gap: 6px; align-items: center; }
    .nav-btn {
      padding: 5px 11px;
      border: 1px solid rgba(196,98,45,0.3);
      background: transparent;
      color: var(--ink-light);
      font-family: var(--font-body);
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; border-radius: 1px; transition: all 0.2s;
      white-space: nowrap;
    }
    .nav-btn:hover { border-color: var(--terra); color: var(--sand); }
    .nav-btn.active { background: rgba(196,98,45,0.15); color: var(--terra); border-color: var(--terra); }

    /* ── CANVAS CONTAINER ──────────────────────────────────────── */
    #canvas-container {
      position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(circle at 30% 25%, rgba(196,98,45,0.07) 0%, transparent 55%),
        radial-gradient(circle at 75% 80%, rgba(196,140,80,0.04) 0%, transparent 50%),
        var(--charcoal);
      cursor: grab;
      overflow: hidden;
    }
    #canvas-container:active { cursor: grabbing; }
    #canvas { display: block; width: 100%; height: 100%; }

    /* ── FACE BADGE (hover label, top-left of canvas) ───────────── */
    #face-badge {
      position: absolute; top: 16px; left: 56px;
      font-family: var(--font-display); font-size: 13px; font-style: italic;
      color: var(--terra); letter-spacing: 0.06em;
      opacity: 0; transition: opacity 0.25s; pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    #face-badge.visible { opacity: 1; }

    /* ── CANVAS HINT ────────────────────────────────────────────── */
    .canvas-hint {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-light); opacity: 0.35; pointer-events: none;
    }
    @media (max-width: 768px) { .canvas-hint { display: none; } }

    /* ── JOURNEY DOTS (vertical, desktop only) ──────────────────── */
    #journey-dots {
      position: fixed; left: 20px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 6px; z-index: 200;
    }
    @media (max-width: 768px) {
      #journey-dots {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex !important;
        flex-direction: row !important;
        gap: 12px;
        z-index: 501;
        background: rgba(13,9,7,0.9);
        padding: 8px 16px;
        border-radius: 30px;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(196,98,45,0.15);
        transition: bottom 0.38s cubic-bezier(0.16, 1, 0.3, 1);
      }
      body:has(#face-panel.open) #journey-dots {
        bottom: calc(54vh + 16px);
      }
      .jdot {
        width: 32px; height: 32px; /* Increased tap target spacing on mobile */
      }
    }

    .jdot {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .jdot::after {
      content: ''; display: block; width: 6px; height: 6px; border-radius: 50%;
      border: 1px solid rgba(196,98,45,0.3); transition: all 0.35s var(--ease-out);
    }
    .jdot.visited::after { background: var(--terra); border-color: var(--terra); }
    .jdot.current::after { background: var(--gold); border-color: var(--gold); transform: scale(1.6); }

    /* ── FACE PANEL ─────────────────────────────────────────────── */
    #face-panel {
      position: fixed; top: 52px; right: 0; bottom: 0; width: 340px;
      background: rgba(13,9,7,0.97);
      border-left: 1px solid rgba(196,98,45,0.15);
      padding: 36px 28px 28px;
      overflow-y: auto;
      transform: translateX(105%);
      transition: transform 0.38s var(--ease-out);
      z-index: 500;
    }
    #face-panel.open { transform: translateX(0); }

    @media (max-width: 768px) {
      #face-panel {
        width: 100%; top: auto; left: 0; right: 0; bottom: 0;
        height: 54vh; border-left: none;
        border-top: 1px solid rgba(196,98,45,0.15);
        transform: translateY(105%);
        padding: 24px 20px 20px;
      }
      #face-panel.open { transform: translateY(0); }
    }

    /* Panel close button */
    #panel-close {
      position: absolute; top: 14px; right: 14px;
      background: none; border: none; color: var(--ink-light);
      font-size: 18px; line-height: 1; cursor: pointer;
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      transition: color 0.2s; border-radius: 1px;
    }
    #panel-close:hover { color: var(--terra); }

    /* Panel typography */
    .panel-eyebrow {
      display: block;
      font-family: var(--font-body);
      font-size: 10px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--terra); margin-bottom: 18px;
    }
    .panel-numeral {
      font-family: var(--font-display);
      font-size: 58px; font-weight: 400; line-height: 1;
      color: var(--gold); margin-bottom: 10px;
    }
    .panel-name {
      font-family: var(--font-fell);
      font-style: italic; font-size: 28px; line-height: 1.15;
      color: var(--sand); margin-bottom: 10px;
    }
    .panel-steep {
      font-family: var(--font-body);
      font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-light); margin-bottom: 22px;
    }
    .panel-element {
      font-family: var(--font-body);
      font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 20px;
    }
    .panel-divider {
      height: 1px; background: rgba(196,98,45,0.2); margin-bottom: 22px;
    }
    .panel-desc {
      font-family: var(--font-body);
      font-size: 15px; line-height: 1.85; font-weight: 300;
      color: var(--sand-mid);
    }
    .panel-freq {
      margin-top: 28px;
      font-family: var(--font-body);
      font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(196,140,80,0.4);
    }

    /* Animate panel content on face change */
    .panel-animate {
      animation: panel-enter 0.38s var(--ease-out) both;
    }
    @keyframes panel-enter {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── PARCHMENT REFLECTION OVERLAY ── */
    .scroll-overlay {
      position: fixed; inset: 0;
      background: rgba(13, 9, 7, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s var(--ease-out);
    }
    .scroll-overlay.open { opacity: 1; pointer-events: auto; }
    .scroll-content {
      width: 90%; max-width: 460px;
      background: #F0E6D2; /* sand parchment background */
      color: #1E1610; /* charcoal text */
      border: 2px solid #C48C50;
      padding: 36px 28px;
      position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,0.9);
      border-radius: 1px;
      transform: scale(0.95);
      transition: transform 0.4s var(--ease-out);
    }
    .scroll-overlay.open .scroll-content { transform: scale(1.0); }
    #scroll-close {
      position: absolute; top: 12px; right: 12px;
      background: none; border: none; color: #1E1610;
      font-size: 24px; cursor: pointer; line-height: 1;
    }
    .scroll-inner {
      text-align: center;
      font-family: var(--font-fell);
    }
    .scroll-header {
      font-size: 11px; font-weight: 600; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--terra);
      margin-bottom: 8px; font-family: var(--font-body);
    }
    .scroll-chamber {
      font-size: 24px; font-style: italic; color: #1E1610;
      margin-bottom: 12px;
    }
    .scroll-divider {
      font-size: 18px; color: #C48C50; margin-bottom: 20px;
    }
    .scroll-body-text {
      font-size: 16px; line-height: 1.8; color: #2B2017;
      text-align: left; max-height: 250px; overflow-y: auto;
      padding-right: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>

<script>
(function () {
    'use strict';

    // ═══════════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════════
    var FACES = [
        { num: 'I',    name: 'Seed',             steep: 'Steep 1',   label: 'Entering',       freq: 261.63, desc: 'The latent potential, resting before the catalyst. Pure, unactivated civilizational memory waiting for the soil.' },
        { num: 'II',   name: 'Awakening',         steep: 'Steep 2',   label: 'Sensing',         freq: 293.66, desc: 'The rupture of the shell. Awareness stretches out toward light :: the historical moment of collective philosophical realization.' },

        { num: 'VII',  name: 'Initiation',        steep: 'Steep 7',   label: 'The Threshold',   freq: 493.88, desc: 'The crucible. The civilization is tested by a challenge that requires a new level of consciousness to meet.' },
        { num: 'VIII', name: 'Shadow-work',       steep: 'Dimension', label: 'Depth',           freq: 466.16, desc: 'The agonizing descent. The society must face the horrors we have created :: our violence, extractions, and lies.' },
        { num: 'IX',   name: 'Integration',       steep: 'Dimension', label: 'Wholeness',       freq: 523.25, desc: 'The synthesis of light and shadow. We accept our full history and move forward with grounded maturity.' },
        { num: 'X',    name: 'Stewardship',       steep: 'Dimension', label: 'Tending',         freq: 587.33, desc: 'The shift from consumption to care. Our collective organizes entirely around the protection of the whole.' },
        { num: 'XI',   name: 'Generativity',      steep: 'Dimension', label: 'Legacy',          freq: 659.25, desc: 'We now build unconditionally for the benefit of future lineages and epochs, gifting our wisdom to the horizon.' },
        { num: 'XII',  name: 'Harvest & Release', steep: 'Steep 7',   label: 'Return',          freq: 698.46, desc: 'The Bloom completes. We distill our wisdom into a seed, release it, and gracefully end the cycle.' }
    ];

    // ═══════════════════════════════════════════════════════════════
    // THREE.JS COLOR PALETTE
    // ═══════════════════════════════════════════════════════════════
    var C_TERRA = new THREE.Color(0xC4622D);
    var C_GOLD  = new THREE.Color(0xC48C50);

    // ═══════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════
    var scene, camera, renderer, dodecahedron;
    var raycaster, mouse;
    var colorsAttr = null;
    var animationFrameId = null;

    var mouseDown  = false;
    var dragMoved  = false;
    var mouseStart = { x: 0, y: 0 };

    var autoRotating = true;
    var soundEnabled = true;   // acoustics on by default — activates on first user gesture

    // Physics momentum & snapping variables
    var rotationVelocityX = 0;
    var rotationVelocityY = 0;
    var lastMousePos = { x: 0, y: 0 };
    var isDragging = false;
    var faceWasAligned = [false, false, false, false, false, false, false, false, false, false, false, false];
    
    // Outlines & normals
    var localNormals = [];
    var faceOutlines = [];
    
    // V2 Somatic Audio Engine Web Audio variables
    var audioCtx = null;
    var noiseBuffers = { pink: null, brown: null };
    var biotextureSources = { Earth: null, Air: null, Ether: null };
    var biotextureGains = { Earth: null, Air: null, Ether: null };
    var droneOsc = null;
    var droneGain = null;

    // Somatic Effects Space Network (The Somatic Bath)
    var dryGainNode = null;
    var wetGainNode = null;
    var feedbackGainNode = null;
    var delayNode = null;
    var spaceFilter = null;

    var FACE_ELEMENTS = [
        'Earth',  // Face 1: Seed
        'Water',  // Face 2: Awakening
        'Fire',   // Face 3: Vitality
        'Air',    // Face 4: Forming
        'Earth',  // Face 5: Imagination
        'Water',  // Face 6: Relationship
        'Fire',   // Face 7: Initiation
        'Air',    // Face 8: Shadow-work
        'Ether',  // Face 9: Integration
        'Fire',   // Face 10: Stewardship
        'Water',  // Face 11: Generativity
        'Ether'   // Face 12: Harvest & Release
    ];

    var ELEMENT_TRANSFORMATIONS = {
        'Earth': 'containment and weight',
        'Water': 'interference and flow',
        'Fire': 'burst and decay',
        'Air': 'ratio and breath',
        'Ether': 'alignment and resolution'
    };

    var hoveredFace  = -1;
    var activeFace   = -1;
    var journeyMode  = false;
    var journeyIndex = 0;
    var journeyTimer = null;

    // Cached DOM refs — queried once in init(), never re-queried
    var elBadge, elPanel, elEyebrow, elNumeral, elName, elSteep, elElement, elDesc, elFreq;
    var elRotateBtn, elJourneyBtn, elSoundBtn, elCloseBtn;
    var dotEls      = [];
    var etchMeshes  = [];   // PlaneGeometry mesh per face, child of dodecahedron
    var etchAnimStart = {}; // faceIdx → timestamp when journey reveal animation began

    // ═══════════════════════════════════════════════════════════════
    // INIT — called once on window load
    // ═══════════════════════════════════════════════════════════════
    function init() {
        var container = document.getElementById('canvas-container');
        var canvasEl  = document.getElementById('canvas');
        if (!container || !canvasEl) return;

        // MåGNET Synchronization
        var activeMagnet = localStorage.getItem('active_magnet') || 'ellian';
        if (activeMagnet === 'curator') {
            C_TERRA.setHex(0xC48C50); // Soft gold base
            C_GOLD.setHex(0xF5D3A6);  // Bright warm gold highlight
        } else if (activeMagnet === 'gleam') {
            C_TERRA.setHex(0x2E4154); // Sleek lunar charcoal/blue base
            C_GOLD.setHex(0xE2F1FF);  // Lunar light shine highlight
        } else {
            C_TERRA.setHex(0xC4622D); // Deep terra base
            C_GOLD.setHex(0xC48C50);  // Soft gold highlight
        }

        // Scene
        scene = new THREE.Scene();

        // Camera
        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.z = 3.2;

        // Renderer
        renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setClearColor(0x000000, 0);

        // Raycaster
        raycaster = new THREE.Raycaster();
        mouse     = new THREE.Vector2();

        // Geometry
        buildDodecahedron();
        buildFaceEtchings();
        initLocalNormalsAndOutlines();
        syncVisitedPath();

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.40));
        var key = new THREE.DirectionalLight(0xF0E6D2, 0.85);
        key.position.set(3, 4, 5);
        scene.add(key);
        var fill = new THREE.DirectionalLight(C_TERRA, 0.22);
        fill.position.set(-3, -2, -4);
        scene.add(fill);

        // Cache static DOM refs before wiring controls
        elBadge      = document.getElementById('face-badge');
        elPanel      = document.getElementById('face-panel');
        elEyebrow    = document.getElementById('panel-eyebrow');
        elNumeral    = document.getElementById('panel-numeral');
        elName       = document.getElementById('panel-name');
        elSteep      = document.getElementById('panel-steep');
        elElement    = document.getElementById('panel-element');
        elDesc       = document.getElementById('panel-desc');
        elFreq       = document.getElementById('panel-freq');
        elRotateBtn  = document.getElementById('rotate-btn');
        elJourneyBtn = document.getElementById('journey-btn');
        elSoundBtn   = document.getElementById('sound-btn');
        elCloseBtn   = document.getElementById('panel-close');

        // Controls & UI
        setupMouseControls(container);
        setupTouchControls(container);
        buildJourneyDots();
        setupButtons();

        // Keyboard
        document.addEventListener('keydown', onKeyDown);

        // Visibility change
        document.addEventListener('visibilitychange', function () {
            if (document.hidden && journeyMode) stopJourney();
        });

        // ResizeObserver — INSIDE init() where container is defined
        new ResizeObserver(function () {
            onResize(container);
        }).observe(container);

        animate();
        document.body.classList.add('is-loaded');

        // Subatomic Somatic subscriber for Breath Alignment
        if (window.HDM_Innerverse_API) {
            window.HDM_Innerverse_API.subscribe(function(state) {
                var breath = state.coherence.breath;
                
                // Scale emissive intensity with breath alignment (pure golden-copper glow)
                if (dodecahedron && dodecahedron.material) {
                    var rVal = 0xC4 * breath / 255;
                    var gVal = 0x8C * breath / 255;
                    var bVal = 0x50 * breath / 255;
                    
                    // Modulate emissive glow
                    if (Array.isArray(dodecahedron.material)) {
                        dodecahedron.material.forEach(function(mat) {
                            mat.emissive.setRGB(rVal * 0.7, gVal * 0.7, bVal * 0.7);
                            mat.needsUpdate = true;
                        });
                    } else {
                        dodecahedron.material.emissive.setRGB(rVal * 0.7, gVal * 0.7, bVal * 0.7);
                        dodecahedron.material.needsUpdate = true;
                    }
                }
            });
        }

        // Global Teardown Registration
        window.hdmPageUnload = function () {
            console.log(":: Dodecahedron Explorer :: Triggering page unload teardown");
            if (journeyTimer) {
                clearTimeout(journeyTimer);
                journeyTimer = null;
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            document.removeEventListener('keydown', onKeyDown);
            
            // Stop active sounds and clean up Web Audio nodes
            Object.keys(biotextureSources).forEach(function (key) {
                if (biotextureSources[key]) {
                    try { biotextureSources[key].stop(); } catch(e) {}
                    biotextureSources[key] = null;
                }
            });
            Object.keys(biotextureGains).forEach(function (key) {
                if (biotextureGains[key]) {
                    try { biotextureGains[key].disconnect(); } catch(e) {}
                    biotextureGains[key] = null;
                }
            });
            if (audioCtx) {
                if (droneOsc) {
                    try { droneOsc.stop(); } catch(e) {}
                    droneOsc = null;
                }
                if (droneGain) {
                    try { droneGain.disconnect(); } catch(e) {}
                    droneGain = null;
                }
                try { audioCtx.close(); } catch(e) {}
                audioCtx = null;
            }

            // Dispose WebGL renderer and geometries/materials
            if (dodecahedron) {
                dodecahedron.traverse(function (node) {
                    if (node.geometry) node.geometry.dispose();
                    if (node.material) {
                        if (Array.isArray(node.material)) {
                            node.material.forEach(function (mat) {
                                if (mat.map) mat.map.dispose();
                                mat.dispose();
                            });
                        } else {
                            if (node.material.map) node.material.map.dispose();
                            node.material.dispose();
                        }
                    }
                });
                scene.remove(dodecahedron);
            }
            if (scene) {
                scene.traverse(function(node) {
                    if (node.geometry) node.geometry.dispose();
                    if (node.material) {
                        if (Array.isArray(node.material)) {
                            node.material.forEach(function(mat) {
                                if (mat.map) mat.map.dispose();
                                mat.dispose();
                            });
                        } else {
                            if (node.material.map) node.material.map.dispose();
                            node.material.dispose();
                        }
                    }
                });
            }
            if (renderer) {
                renderer.dispose();
                renderer.forceContextLoss();
                var canvas = renderer.domElement;
                if (canvas && canvas.parentNode) {
                    canvas.parentNode.removeChild(canvas);
                }
                renderer = null;
            }
        };
    }

    // ═══════════════════════════════════════════════════════════════
    // GEOMETRY
    // DodecahedronGeometry(1,0).toNonIndexed() → 12 penta faces
    // Each pentagon = 3 triangles → 36 triangles → 108 vertices
    // faceIndex from raycaster is per-triangle (0–35)
    // Math.floor(faceIndex / 3) → pentagon index 0–11
    // ═══════════════════════════════════════════════════════════════
    function buildDodecahedron() {
        var geo   = new THREE.DodecahedronGeometry(1, 0).toNonIndexed();
        geo.clearGroups();
        for (var f = 0; f < 12; f++) {
            geo.addGroup(f * 9, 9, f);
        }

        var mats = [];
        for (var f = 0; f < 12; f++) {
            mats.push(new THREE.MeshPhongMaterial({
                color: C_TERRA,
                shininess: 30,
                specular: new THREE.Color(0x3A2010),
                emissive: new THREE.Color(0x000000),
                emissiveIntensity: 0.8
            }));
        }

        dodecahedron = new THREE.Mesh(geo, mats);
        scene.add(dodecahedron);

        // Pentagon edge overlay — indexed geometry for clean lines, child rotates with parent
        var edgeGeo = new THREE.EdgesGeometry(new THREE.DodecahedronGeometry(1, 0));
        dodecahedron.add(new THREE.LineSegments(edgeGeo,
            new THREE.LineBasicMaterial({ color: C_GOLD, transparent: true, opacity: 0.22 })
        ));
    }

    // ═══════════════════════════════════════════════════════════════
    // FACE ETCHINGS — laser-etched numeral + symbol on each face
    // Each pentagon = 9 vertices (3 triangles × 3).
    // Face centroid = average of those 9, pushed slightly outward.
    // Sprites are children of dodecahedron so they rotate with it.
    // ═══════════════════════════════════════════════════════════════
    function buildFaceEtchings() {
        var pos = dodecahedron.geometry.attributes.position;
        var up  = new THREE.Vector3(0, 0, 1); // PlaneGeometry default normal

        for (var f = 0; f < 12; f++) {
            var cx = 0, cy = 0, cz = 0;
            var base = f * 9;
            for (var v = 0; v < 9; v++) {
                cx += pos.getX(base + v);
                cy += pos.getY(base + v);
                cz += pos.getZ(base + v);
            }
            cx /= 9; cy /= 9; cz /= 9;

            var len    = Math.sqrt(cx * cx + cy * cy + cz * cz);
            var normal = new THREE.Vector3(cx / len, cy / len, cz / len);
            var push   = 1.04 / len; // sit just above the face surface

            var tex = makeEtchingTexture(f);
            var mat = new THREE.MeshBasicMaterial({
                map:         tex,
                transparent: true,
                depthWrite:  false,
                side:        THREE.DoubleSide,
                opacity:     0.82
            });
            var plane = new THREE.Mesh(new THREE.PlaneGeometry(0.40, 0.40), mat);

            // Orient plane to lie flat on the face
            var quat = new THREE.Quaternion();
            quat.setFromUnitVectors(up, normal);
            plane.quaternion.copy(quat);
            plane.position.set(cx * push, cy * push, cz * push);

            dodecahedron.add(plane);
            etchMeshes.push(plane);
        }
    }

    function makeEtchingTexture(faceIdx) {
        var size = 128;
        var cv   = document.createElement('canvas');
        cv.width = size; cv.height = size;
        var ctx  = cv.getContext('2d');
        var mid  = size / 2;

        ctx.strokeStyle = 'rgba(240, 230, 210, 0.90)';
        ctx.fillStyle   = 'rgba(240, 230, 210, 0.90)';
        ctx.lineWidth   = 2.5;
        ctx.lineCap     = 'round';
        ctx.lineJoin    = 'round';

        // Symbol in upper half, numeral below
        drawFaceSymbol(ctx, faceIdx, mid, mid - 16, 26);

        ctx.font         = 'bold 17px "Inter", sans-serif';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(FACES[faceIdx].num, mid, mid + 26);

        return new THREE.CanvasTexture(cv);
    }

    function drawFaceSymbol(ctx, faceIdx, cx, cy, r) {
        var i, a, x, y;
        switch (faceIdx) {
            case 0: // I · Seed — single filled dot (latent potential)
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.30, 0, Math.PI * 2);
                ctx.fill();
                break;

            case 1: // II · Awakening — rising arc (shell opening to light)
                ctx.beginPath();
                ctx.arc(cx, cy + r * 0.35, r * 0.62, Math.PI, 0);
                ctx.stroke();
                break;

            case 2: // III · Vitality — three radial spokes (burst of energy)
                for (i = 0; i < 3; i++) {
                    a = (i * Math.PI * 2 / 3) - Math.PI / 2;
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(a) * r * 0.18, cy + Math.sin(a) * r * 0.18);
                    ctx.lineTo(cx + Math.cos(a) * r * 0.80, cy + Math.sin(a) * r * 0.80);
                    ctx.stroke();
                }
                break;

            case 3: // IV · Forming — square (structure, containment)
                var s = r * 0.54;
                ctx.strokeRect(cx - s, cy - s, s * 2, s * 2);
                break;

            case 4: // V · Imagination — pentagon (the face shape itself — recursive)
                ctx.beginPath();
                for (i = 0; i < 5; i++) {
                    a = (i * Math.PI * 2 / 5) - Math.PI / 2;
                    x = cx + Math.cos(a) * r * 0.72;
                    y = cy + Math.sin(a) * r * 0.72;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
                break;

            case 5: // VI · Relationship — vesica piscis (two circles, the shape of meeting)
                ctx.beginPath();
                ctx.arc(cx - r * 0.24, cy, r * 0.44, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + r * 0.24, cy, r * 0.44, 0, Math.PI * 2);
                ctx.stroke();
                break;

            case 6: // VII · Initiation — threshold / doorway (two uprights + lintel)
                ctx.beginPath();
                ctx.moveTo(cx - r * 0.36, cy + r * 0.55);
                ctx.lineTo(cx - r * 0.36, cy - r * 0.50);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + r * 0.36, cy + r * 0.55);
                ctx.lineTo(cx + r * 0.36, cy - r * 0.50);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - r * 0.36, cy - r * 0.50);
                ctx.lineTo(cx + r * 0.36, cy - r * 0.50);
                ctx.stroke();
                break;

            case 7: // VIII · Shadow-work — lemniscate ∞ (infinite depth)
                ctx.beginPath();
                ctx.arc(cx - r * 0.30, cy, r * 0.30, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + r * 0.30, cy, r * 0.30, 0, Math.PI * 2);
                ctx.stroke();
                break;

            case 8: // IX · Integration — circle with center point (wholeness)
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.58, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.13, 0, Math.PI * 2);
                ctx.fill();
                break;

            case 9: // X · Stewardship — open vessel / cup (tending what is held)
                ctx.beginPath();
                ctx.moveTo(cx - r * 0.56, cy + r * 0.28);
                ctx.quadraticCurveTo(cx - r * 0.56, cy + r * 0.72, cx, cy + r * 0.72);
                ctx.quadraticCurveTo(cx + r * 0.56, cy + r * 0.72, cx + r * 0.56, cy + r * 0.28);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - r * 0.68, cy + r * 0.28);
                ctx.lineTo(cx + r * 0.68, cy + r * 0.28);
                ctx.stroke();
                break;

            case 10: // XI · Generativity — branching Y (legacy, forking into future)
                ctx.beginPath();
                ctx.moveTo(cx, cy + r * 0.55);
                ctx.lineTo(cx, cy + r * 0.05);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx, cy + r * 0.05);
                ctx.lineTo(cx - r * 0.48, cy - r * 0.50);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx, cy + r * 0.05);
                ctx.lineTo(cx + r * 0.48, cy - r * 0.50);
                ctx.stroke();
                break;

            case 11: // XII · Harvest & Release — open arc + falling seed (cycle completes)
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.58, Math.PI * 0.18, Math.PI * 0.82, false);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy + r * 0.80, r * 0.11, 0, Math.PI * 2);
                ctx.fill();
                break;
        }
    }

    // Update etching mesh opacity + tint to reflect interaction state
    function setEtchingState(faceIdx, state) {
        if (faceIdx < 0 || faceIdx >= etchMeshes.length) return;
        var mat = etchMeshes[faceIdx].material;
        if (state === 'active') {
            mat.opacity = 1.0;
            mat.color.set(0xC48C50); // gold — selected
        } else if (state === 'hover') {
            mat.opacity = 0.95;
            mat.color.set(0xF0E6D2); // sand — lit
        } else {
            mat.opacity = 0.82;
            mat.color.set(0xF0E6D2); // sand — resting
        }
        mat.needsUpdate = true;
    }

    // Set all 9 vertices of one pentagon face to a given color
    function setFaceColor(faceIdx, color) {
        if (dodecahedron && Array.isArray(dodecahedron.material) && dodecahedron.material[faceIdx]) {
            dodecahedron.material[faceIdx].color.copy(color);
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // RENDER LOOP
    // ═══════════════════════════════════════════════════════════════
    var ETCH_ANIM_MS = 650; // journey reveal duration

    function getFaceClosestToCamera() {
        if (!localNormals.length) return -1;
        var maxZ = -Infinity;
        var closestFace = -1;
        for (var f = 0; f < 12; f++) {
            var worldNormal = localNormals[f].clone().applyQuaternion(dodecahedron.quaternion);
            if (worldNormal.z > maxZ) {
                maxZ = worldNormal.z;
                closestFace = f;
            }
        }
        return closestFace;
    }

    function animate() {
        animationFrameId = requestAnimationFrame(animate);
        
        var speedMult = 1.0;
        if (window.HDM_Innerverse_API) {
            var breath = window.HDM_Innerverse_API.getCoherence().breath;
            // Scale rotation speed down to a tranquil drift (15% speed) at full breath alignment
            speedMult = 1.0 - (breath * 0.85);
        }
        
        if (mouseDown === false && isDragging === false && autoRotating === true) {
            dodecahedron.rotation.y += 0.003 * speedMult;
            dodecahedron.rotation.x += 0.001 * speedMult;
        } else if (mouseDown === false && isDragging === false && autoRotating === false) {
            // Apply physics momentum and friction
            rotationVelocityX *= 0.94;
            rotationVelocityY *= 0.94;
            
            var speed = Math.sqrt(rotationVelocityX * rotationVelocityX + rotationVelocityY * rotationVelocityY);
            if (speed > 0.0005) {
                dodecahedron.rotation.x += rotationVelocityX;
                dodecahedron.rotation.y += rotationVelocityY;
            } else {
                // Snapping mode
                rotationVelocityX = 0;
                rotationVelocityY = 0;
                
                var closestFace = getFaceClosestToCamera();
                if (closestFace >= 0) {
                    var qTarget = new THREE.Quaternion().setFromUnitVectors(localNormals[closestFace], new THREE.Vector3(0, 0, 1));
                    dodecahedron.quaternion.slerp(qTarget, 0.08);
                    
                    if (dodecahedron.quaternion.angleTo(qTarget) < 0.01) {
                        dodecahedron.quaternion.copy(qTarget);
                        if (activeFace !== closestFace) {
                            selectFace(closestFace);
                        }
                    }
                }
            }
        }

        // Tactile Audial Plucks check
        if (localNormals.length > 0) {
            for (var f = 0; f < 12; f++) {
                var worldNormal = localNormals[f].clone().applyQuaternion(dodecahedron.quaternion);
                var isAligned = worldNormal.z >= 0.985;
                if (isAligned && !faceWasAligned[f]) {
                    triggerPluckChime(f);
                }
                faceWasAligned[f] = isAligned;
            }
        }

        var now = performance.now();

        // Resonant frequency pulse on active face — lower Hz breathes slower
        if (activeFace >= 0 && etchMeshes[activeFace]) {
            var vizHz  = 0.5 + (FACES[activeFace].freq - 261.63) / (698.46 - 261.63) * 1.5;
            var pulse  = 1.0 + 0.08 * Math.sin(now * 0.001 * Math.PI * 2 * vizHz);
            etchMeshes[activeFace].scale.set(pulse, pulse, 1);
        }

        // Journey reveal — scale from 0 → 1 over ETCH_ANIM_MS with ease-out
        var keys = Object.keys(etchAnimStart);
        for (var k = 0; k < keys.length; k++) {
            var fi      = parseInt(keys[k]);
            var elapsed = now - etchAnimStart[fi];
            var t       = Math.min(elapsed / ETCH_ANIM_MS, 1.0);
            var ease    = 1 - Math.pow(1 - t, 3); // cubic ease-out
            if (fi === activeFace) {
                // Active face scaling is governed by the pulse animation
            } else {
                if (etchMeshes[fi]) {
                    etchMeshes[fi].scale.set(ease, ease, 1);
                }
            }
            if (t >= 1.0) delete etchAnimStart[fi];
        }

        renderer.render(scene, camera);
    }

    // ═══════════════════════════════════════════════════════════════
    // RESIZE
    // ═══════════════════════════════════════════════════════════════
    function onResize(container) {
        var w = container.clientWidth;
        var h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }

    // ═══════════════════════════════════════════════════════════════
    // HIT TESTING
    // clientToNDC shared by mouse hover, mouse click, and touch tap
    // ═══════════════════════════════════════════════════════════════
    function clientToNDC(clientX, clientY) {
        var rect = renderer.domElement.getBoundingClientRect();
        return {
            x: ((clientX - rect.left) / rect.width)  *  2 - 1,
            y: ((clientY - rect.top)  / rect.height) * -2 + 1
        };
    }

    function getFaceAt(clientX, clientY) {
        var ndc = clientToNDC(clientX, clientY);
        mouse.set(ndc.x, ndc.y);
        raycaster.setFromCamera(mouse, camera);
        var hits = raycaster.intersectObject(dodecahedron);
        if (!hits.length) return -1;
        return Math.floor(hits[0].faceIndex / 3);
    }

    // ═══════════════════════════════════════════════════════════════
    // MOUSE CONTROLS
    // ═══════════════════════════════════════════════════════════════
    function setupMouseControls(container) {
        container.addEventListener('mousedown', function (e) {
            mouseDown  = true;
            isDragging = true;
            dragMoved  = false;
            mouseStart = { x: e.clientX, y: e.clientY };
            lastMousePos = { x: e.clientX, y: e.clientY };
            rotationVelocityX = 0;
            rotationVelocityY = 0;
            
            // Interaction overrides auto-rotation
            autoRotating = false;
            if (elRotateBtn) elRotateBtn.classList.remove('active');
        });

        container.addEventListener('mousemove', function (e) {
            if (mouseDown) {
                var dx = e.clientX - lastMousePos.x;
                var dy = e.clientY - lastMousePos.y;
                if (!dragMoved && (Math.abs(e.clientX - mouseStart.x) > 3 || Math.abs(e.clientY - mouseStart.y) > 3)) {
                    dragMoved = true;
                }
                if (dragMoved) {
                    rotationVelocityY = dx * 0.005;
                    rotationVelocityX = dy * 0.005;
                    dodecahedron.rotation.y += rotationVelocityY;
                    dodecahedron.rotation.x += rotationVelocityX;
                    lastMousePos = { x: e.clientX, y: e.clientY };
                }
            } else {
                // Hover — getFaceAt handles NDC conversion
                var face = getFaceAt(e.clientX, e.clientY);
                if (face !== hoveredFace) {
                    if (hoveredFace >= 0 && hoveredFace !== activeFace) {
                        setFaceColor(hoveredFace, C_TERRA);
                        setEtchingState(hoveredFace, 'idle');
                    }
                    hoveredFace = face;
                    if (face >= 0) {
                        if (face !== activeFace) {
                            setFaceColor(face, C_GOLD);
                            setEtchingState(face, 'hover');
                        }
                        if (elBadge) {
                            var elem = FACE_ELEMENTS[face];
                            var transformMode = ELEMENT_TRANSFORMATIONS[elem];
                            elBadge.textContent = FACES[face].num + ' · ' + FACES[face].name + ' (' + elem + ' :: ' + transformMode + ')';
                            elBadge.classList.add('visible');
                        }
                    } else {
                        if (elBadge) elBadge.classList.remove('visible');
                    }
                }
            }
        }, { passive: true });

        // mouseup on document so drag-release outside container is caught
        document.addEventListener('mouseup', function (e) {
            if (!mouseDown) return;
            mouseDown = false;
            isDragging = false;
            if (!dragMoved) {
                var face = getFaceAt(e.clientX, e.clientY);
                if (face >= 0) {
                    selectFace(face);
                    // Check if it has a reflection in localStorage
                    var sessionStr = localStorage.getItem('bloom_current_session_v1');
                    if (sessionStr) {
                        try {
                            var session = JSON.parse(sessionStr);
                            if (session && session.reflections && session.reflections[face + 1]) {
                                showReflectionScroll(face);
                            }
                        } catch(err){}
                    }
                }
            }
            dragMoved = false;
        });

        container.addEventListener('wheel', function (e) {
            e.preventDefault();
            camera.position.z = Math.max(1.8, Math.min(6.5, camera.position.z + e.deltaY * 0.003));
        }, { passive: false });
    }

    // ═══════════════════════════════════════════════════════════════
    // TOUCH CONTROLS
    // touchStart: rolling delta position (updated each touchmove frame)
    // touchOrigin: fixed tap-down position (used only at touchend)
    // ═══════════════════════════════════════════════════════════════
    function setupTouchControls(container) {
        var touchStart    = null;
        var touchOrigin   = null;
        var lastPinchDist = null;

        container.addEventListener('touchstart', function (e) {
            if (e.touches.length === 1) {
                touchOrigin   = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                touchStart    = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                lastPinchDist = null;
                isDragging = true;
                rotationVelocityX = 0;
                rotationVelocityY = 0;
                
                // Interaction overrides auto-rotation
                autoRotating = false;
                if (elRotateBtn) elRotateBtn.classList.remove('active');
            } else if (e.touches.length === 2) {
                lastPinchDist = Math.hypot(
                    e.touches[1].clientX - e.touches[0].clientX,
                    e.touches[1].clientY - e.touches[0].clientY
                );
                touchStart  = null;
                touchOrigin = null;
                isDragging = false;
            }
        }, { passive: true });

        container.addEventListener('touchmove', function (e) {
            if (e.touches.length === 1 && touchStart) {
                var dx = e.touches[0].clientX - touchStart.x;
                var dy = e.touches[0].clientY - touchStart.y;
                rotationVelocityY = dx * 0.006;
                rotationVelocityX = dy * 0.006;
                dodecahedron.rotation.y += rotationVelocityY;
                dodecahedron.rotation.x += rotationVelocityX;
                touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2 && lastPinchDist !== null) {
                var d = Math.hypot(
                    e.touches[1].clientX - e.touches[0].clientX,
                    e.touches[1].clientY - e.touches[0].clientY
                );
                camera.position.z = Math.max(1.8, Math.min(6.5, camera.position.z - (d - lastPinchDist) * 0.015));
                lastPinchDist = d;
            }
        }, { passive: true });

        container.addEventListener('touchend', function (e) {
            isDragging = false;
            if (e.changedTouches.length === 1 && touchOrigin) {
                var dx = e.changedTouches[0].clientX - touchOrigin.x;
                var dy = e.changedTouches[0].clientY - touchOrigin.y;
                if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
                    var face = getFaceAt(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                    if (face >= 0) {
                        selectFace(face);
                        // Check if it has a reflection in localStorage
                        var sessionStr = localStorage.getItem('bloom_current_session_v1');
                        if (sessionStr) {
                            try {
                                var session = JSON.parse(sessionStr);
                                if (session && session.reflections && session.reflections[face + 1]) {
                                    showReflectionScroll(face);
                                }
                            } catch(err){}
                        }
                    }
                }
            }
            touchStart  = null;
            touchOrigin = null;
        }, { passive: true });
    }

    // ═══════════════════════════════════════════════════════════════
    // SELECT FACE
    // ═══════════════════════════════════════════════════════════════
    function selectFace(faceIdx) {
        if (activeFace >= 0 && activeFace !== faceIdx) {
            setFaceColor(activeFace, C_TERRA);
            setEtchingState(activeFace, 'idle');
        }
        activeFace = faceIdx;
        setFaceColor(faceIdx, C_GOLD);
        setEtchingState(faceIdx, 'active');

        // Journey mode: collapse to zero and reveal via animate() ease-out
        if (journeyMode && etchMeshes[faceIdx]) {
            etchMeshes[faceIdx].scale.set(0, 0, 1);
            etchAnimStart[faceIdx] = performance.now();
        }

        updateDots(faceIdx);
        openPanel(faceIdx);
        if (soundEnabled) playSound(faceIdx);
    }

    // ═══════════════════════════════════════════════════════════════
    // FACE PANEL
    // ═══════════════════════════════════════════════════════════════
    function openPanel(faceIdx) {
        if (!elPanel) return;
        var f = FACES[faceIdx];

        var elem = FACE_ELEMENTS[faceIdx];
        var transformMode = ELEMENT_TRANSFORMATIONS[elem];

        if (elEyebrow) elEyebrow.textContent = 'Face ' + f.num;
        if (elNumeral) elNumeral.textContent = f.num;
        if (elName)    elName.textContent    = f.name;
        if (elSteep)   elSteep.textContent   = f.steep + ' · ' + f.label;
        if (elElement) elElement.textContent = elem + ' :: ' + transformMode;
        if (elDesc)    elDesc.textContent    = f.desc;
        if (elFreq)    elFreq.textContent    = f.freq + ' Hz';

        [elEyebrow, elNumeral, elName, elSteep, elElement, elDesc].forEach(function (el) {
            if (!el) return;
            el.classList.remove('panel-animate');
            void el.offsetWidth; // reflow resets the animation
            el.classList.add('panel-animate');
        });

        elPanel.classList.add('open');
    }

    function closePanel() {
        if (elPanel) elPanel.classList.remove('open');
        if (activeFace >= 0) {
            setFaceColor(activeFace, C_TERRA);
            setEtchingState(activeFace, 'idle');
            activeFace = -1;
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // JOURNEY DOTS
    // ═══════════════════════════════════════════════════════════════
    function buildJourneyDots() {
        var container = document.getElementById('journey-dots');
        if (!container) return;
        for (var i = 0; i < 12; i++) {
            var btn = document.createElement('button');
            btn.className = 'jdot';
            btn.setAttribute('aria-label', 'Face ' + FACES[i].num + ' – ' + FACES[i].name);
            btn.addEventListener('click', (function (idx) {
                return function () { selectFace(idx); };
            }(i)));
            container.appendChild(btn);
            dotEls.push(btn); // cache ref — avoids getElementById loop in updateDots
        }
    }

    function updateDots(faceIdx) {
        for (var i = 0; i < dotEls.length; i++) {
            dotEls[i].classList.remove('current', 'visited');
            if (i === faceIdx)    dotEls[i].classList.add('current');
            else if (i < faceIdx) dotEls[i].classList.add('visited');
        }
    }

    // JOURNEY MODE
    // ═══════════════════════════════════════════════════════════════
    function startJourney() {
        journeyMode  = true;
        journeyIndex = 0;
        autoRotating = true;
        if (elJourneyBtn) elJourneyBtn.classList.add('active');
        selectFace(0);
        journeyTimer = setTimeout(journeyStep, 3500);

    function journeyStep() {
        if (!journeyMode) return;
        journeyIndex = (journeyIndex + 1) % 12;
        selectFace(journeyIndex);
        journeyTimer = setTimeout(journeyStep, 3500);

    function toggleJourney() {
        if (journeyMode) stopJourney(); else startJourney();
    }

    function initAudioContext() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Dry routing path
            dryGainNode = audioCtx.createGain();
            dryGainNode.gain.setValueAtTime(0.55, audioCtx.currentTime);
            dryGainNode.connect(audioCtx.destination);

            // Wet spatial delay routing (The Somatic Bath)
            delayNode = audioCtx.createDelay(3.0);
            delayNode.delayTime.setValueAtTime(0.618, audioCtx.currentTime); // Golden Ratio temporal spacing

            feedbackGainNode = audioCtx.createGain();
            feedbackGainNode.gain.setValueAtTime(0.58, audioCtx.currentTime); // Infinite-feeling warm decay

            spaceFilter = audioCtx.createBiquadFilter();
            spaceFilter.type = 'lowpass';
            spaceFilter.frequency.setValueAtTime(1400, audioCtx.currentTime); // Soften high frequencies for a warm space bath

            wetGainNode = audioCtx.createGain();
            wetGainNode.gain.setValueAtTime(0.48, audioCtx.currentTime);

            // Construct feedback loop: delay -> filter -> feedbackGain -> delay
            delayNode.connect(spaceFilter);
            spaceFilter.connect(feedbackGainNode);
            feedbackGainNode.connect(delayNode);

            // Connect wet path output to destination
            spaceFilter.connect(wetGainNode);
            wetGainNode.connect(audioCtx.destination);

            generateNoiseBuffers();
            initBiotextures();
            updateBiotextureVolumes();

            // Establish continuous 144Hz background drone
            droneOsc = audioCtx.createOscillator();
            droneOsc.type = 'sine';
            droneOsc.frequency.setValueAtTime(144.0, audioCtx.currentTime);
            droneGain = audioCtx.createGain();
            droneGain.gain.setValueAtTime(soundEnabled ? 0.015 : 0.0, audioCtx.currentTime);
            droneOsc.connect(droneGain);
            droneGain.connect(audioCtx.destination);
            droneOsc.start();
        } catch(e) {
            console.warn(":: Dodecahedron Explorer :: Failed to initialize somatic audio:", e);
        }
    }

    function generateNoiseBuffers() {
        if (!audioCtx) return;
        var sampleRate = audioCtx.sampleRate;
        var bufferSize = 2 * sampleRate;
        
        // Brown noise
        var brown = audioCtx.createBuffer(1, bufferSize, sampleRate);
        var brownData = brown.getChannelData(0);
        var lastOut = 0.0;
        for (var i = 0; i < bufferSize; i++) {
            var white = Math.random() * 2 - 1;
            brownData[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = brownData[i];
            brownData[i] *= 3.5;
        }
        noiseBuffers.brown = brown;

        // Pink noise
        var pink = audioCtx.createBuffer(1, bufferSize, sampleRate);
        var pinkData = pink.getChannelData(0);
        var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (var i = 0; i < bufferSize; i++) {
            var white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            pinkData[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
            pinkData[i] *= 0.11;
            b6 = white * 0.115926;
        }
        noiseBuffers.pink = pink;
    }

    function initBiotextures() {
        if (!audioCtx) return;
        
        // Earth Biotexture
        var earthSrc = audioCtx.createBufferSource();
        earthSrc.buffer = noiseBuffers.brown;
        earthSrc.loop = true;
        var earthFilter = audioCtx.createBiquadFilter();
        earthFilter.type = 'lowpass';
        earthFilter.frequency.value = 120;
        biotextureGains.Earth = audioCtx.createGain();
        biotextureGains.Earth.gain.value = 0.0;
        earthSrc.connect(earthFilter);
        earthFilter.connect(biotextureGains.Earth);
        biotextureGains.Earth.connect(audioCtx.destination);
        earthSrc.start();
        biotextureSources.Earth = earthSrc;

        // Air Biotexture
        var airSrc = audioCtx.createBufferSource();
        airSrc.buffer = noiseBuffers.pink;
        airSrc.loop = true;
        var airFilter = audioCtx.createBiquadFilter();
        airFilter.type = 'highpass';
        airFilter.frequency.value = 4000;
        biotextureGains.Air = audioCtx.createGain();
        biotextureGains.Air.gain.value = 0.0;
        airSrc.connect(airFilter);
        airFilter.connect(biotextureGains.Air);
        biotextureGains.Air.connect(audioCtx.destination);
        airSrc.start();
        biotextureSources.Air = airSrc;

        // Ether Biotexture
        var etherSrc = audioCtx.createBufferSource();
        etherSrc.buffer = noiseBuffers.brown;
        etherSrc.loop = true;
        var etherFilter = audioCtx.createBiquadFilter();
        etherFilter.type = 'bandpass';
        etherFilter.frequency.value = 432;
        biotextureGains.Ether = audioCtx.createGain();
        biotextureGains.Ether.gain.value = 0.0;
        etherSrc.connect(etherFilter);
        etherFilter.connect(biotextureGains.Ether);
        biotextureGains.Ether.connect(audioCtx.destination);
        etherSrc.start();
        biotextureSources.Ether = etherSrc;
    }

    function updateBiotextureVolumes() {
        if (!audioCtx) return;
        var active = soundEnabled;
        
        var earthVolume = active ? 0.012 : 0.0;
        var airVolume = active ? 0.005 : 0.0;
        var etherVolume = active ? 0.010 : 0.0;

        if (biotextureGains.Earth) biotextureGains.Earth.gain.setTargetAtTime(earthVolume, audioCtx.currentTime, 0.5);
        if (biotextureGains.Air) biotextureGains.Air.gain.setTargetAtTime(airVolume, audioCtx.currentTime, 0.5);
        if (biotextureGains.Ether) biotextureGains.Ether.gain.setTargetAtTime(etherVolume, audioCtx.currentTime, 0.5);
        if (droneGain) {
            var droneVol = active ? 0.015 : 0.0;
            droneGain.gain.setTargetAtTime(droneVol, audioCtx.currentTime, 0.5);
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        updateBiotextureVolumes();
        if (elSoundBtn) {
            elSoundBtn.classList.toggle('active', soundEnabled);
            elSoundBtn.textContent = soundEnabled ? 'Sound On' : 'Sound';
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // SOUND — Real-time Mathematical Synthesizers (Vanilla Web Audio)
    // ═══════════════════════════════════════════════════════════════
    
    function playKineticSnap(element) {
        if (!audioCtx || !soundEnabled) return;
        
        var now = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        
        if (element === 'Earth') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.015);
            gain.gain.setValueAtTime(0.035, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.015);
        } else if (element === 'Fire') {
            var bufferSize = audioCtx.sampleRate * 0.008;
            var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            var data = buffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            var noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            var noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.045, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.008);
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start(now);
            return;
        } else if (element === 'Water') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2500, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.025);
            gain.gain.setValueAtTime(0.040, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);
        } else if (element === 'Ether') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(4000, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.040);
            gain.gain.setValueAtTime(0.025, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.040);
        } else {
            return; // Air does not have a kinetic snap
        }
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
    }

    function playSomaticNote(faceIdx) {
        if (!audioCtx || !soundEnabled) return;
        
        var element = FACE_ELEMENTS[faceIdx];
        var freq = FACES[faceIdx].freq;
        var now = audioCtx.currentTime;
        
        // Trigger somatic snap
        playKineticSnap(element);
        
        if (element === 'Earth') {
            createOsc(freq, 'triangle', 0.024, 0.040, 0.350, now);
            createOsc(freq / 2, 'sine', 0.18, 0.080, 0.770, now);
            createOsc(freq * 1.5, 'triangle', 0.10, 0.050, 0.490, now);
            
        } else if (element === 'Water') {
            createOsc(freq * 1.005, 'sine', 0.018, 0.050, 0.600, now);
            createOsc(freq * 0.995, 'sine', 0.018, 0.060, 0.620, now);
            createOsc(freq / 2, 'sine', 0.015, 0.080, 0.800, now);
            
        } else if (element === 'Fire') {
            createOsc(freq, 'sine', 0.018, 0.015, 0.240, now);
            createOsc(freq * 1.25, 'triangle', 0.008, 0.020, 0.180, now);
            createOsc(freq * 1.5, 'triangle', 0.012, 0.018, 0.200, now);
            
        } else if (element === 'Air') {
            var phi = (1 + Math.sqrt(5)) / 2;
            createOsc(freq, 'sine', 0.018, 0.120, 0.850, now);
            createOsc(freq * phi, 'sine', 0.008, 0.180, 1.200, now);
            createOsc(freq * (phi - 1), 'sine', 0.005, 0.150, 1.100, now);
            
        } else if (element === 'Ether') {
            createOsc(freq * 4, 'sine', 0.008, 0.040, 1.000, now);
            createOsc(freq * 2, 'sine', 0.012, 0.050, 1.200, now);
            createOsc(freq, 'sine', 0.022, 0.060, 0.900, now);
            createOsc(freq / 2, 'sine', 0.018, 0.080, 1.500, now);
        }

        // Calibrate Web Audio overtones using exact phi and phi - 1 multipliers
        const PHI = 1.6180339887;
        createOsc(freq * PHI, 'sine', 0.012, 0.080, 1.500, now);
        createOsc(freq * (PHI - 1), 'sine', 0.015, 0.100, 1.800, now);
    }

    function createOsc(hz, type, gainValue, attack, decay, now) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(hz, now);
        
        // Slowly drift frequency fractionally to simulate acoustic string physical instability
        var lfoAmount = hz * 0.002;
        osc.frequency.linearRampToValueAtTime(hz + lfoAmount, now + attack + decay);
        
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(gainValue, now + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + attack + decay);
        
        osc.connect(gain);
        
        // Connect to both dry output and the somatic spatial delay bath!
        if (dryGainNode) gain.connect(dryGainNode);
        if (delayNode) gain.connect(delayNode);
        
        osc.start(now);
        osc.stop(now + attack + decay + 0.5);
    }

    function playSound(faceIdx) {
        initAudioContext();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        playSomaticNote(faceIdx);
    }

    // ── INTER-PORTAL INTEGRATION HELPERS ──
    function initLocalNormalsAndOutlines() {
        var pos = dodecahedron.geometry.attributes.position;
        localNormals = [];
        faceOutlines = [];
        
        for (var f = 0; f < 12; f++) {
            // Calculate normal
            var v0 = new THREE.Vector3().fromBufferAttribute(pos, f * 9);
            var v1 = new THREE.Vector3().fromBufferAttribute(pos, f * 9 + 1);
            var v2 = new THREE.Vector3().fromBufferAttribute(pos, f * 9 + 2);
            var norm = new THREE.Vector3();
            new THREE.Triangle(v0, v1, v2).getNormal(norm);
            localNormals.push(norm.normalize());
            
            // Find 5 unique vertices
            var uniquePoints = [];
            for (var i = 0; i < 9; i++) {
                var p = new THREE.Vector3().fromBufferAttribute(pos, f * 9 + i);
                var found = false;
                for (var j = 0; j < uniquePoints.length; j++) {
                    if (uniquePoints[j].distanceTo(p) < 0.0001) {
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    uniquePoints.push(p);
                }
            }
            
            // Calculate centroid
            var centroid = new THREE.Vector3();
            uniquePoints.forEach(function(pt) { centroid.add(pt); });
            centroid.divideScalar(uniquePoints.length);
            
            // Project onto 2D plane and sort CCW
            var normalVec = localNormals[f];
            var tangent = new THREE.Vector3();
            if (Math.abs(normalVec.x) > 0.9) {
                tangent.set(0, 1, 0);
            } else {
                tangent.set(1, 0, 0);
            }
            var bitangent = new THREE.Vector3().crossVectors(normalVec, tangent).normalize();
            tangent.crossVectors(bitangent, normalVec).normalize();
            
            uniquePoints.sort(function(a, b) {
                var da = a.clone().sub(centroid);
                var db = b.clone().sub(centroid);
                var xa = da.dot(tangent);
                var ya = da.dot(bitangent);
                var xb = db.dot(tangent);
                var yb = db.dot(bitangent);
                var angleA = Math.atan2(ya, xa);
                var angleB = Math.atan2(yb, xb);
                return angleA - angleB;
            });
            
            // Add first point again to close loop
            uniquePoints.push(uniquePoints[0].clone());
            
            var lineGeo = new THREE.BufferGeometry().setFromPoints(uniquePoints);
            var lineMaterial = new THREE.LineBasicMaterial({
                color: C_GOLD,
                transparent: true,
                opacity: 0.0
            });
            var faceOutline = new THREE.Line(lineGeo, lineMaterial);
            // Push slightly outward along normal
            faceOutline.position.addScaledVector(localNormals[f], 0.005);
            dodecahedron.add(faceOutline);
            faceOutlines.push(faceOutline);
        }
    }

    function syncVisitedPath() {
        var sessionStr = localStorage.getItem('bloom_current_session_v1');
        if (!sessionStr) return;
        try {
            var session = JSON.parse(sessionStr);
            if (session && Array.isArray(session.faces_visited)) {
                session.faces_visited.forEach(function(faceNum) {
                    var faceIdx = faceNum - 1;
                    if (dodecahedron && Array.isArray(dodecahedron.material) && dodecahedron.material[faceIdx]) {
                        // visited face: gold/orange emissive glow
                        dodecahedron.material[faceIdx].emissive.setHex(0xC4622D);
                        dodecahedron.material[faceIdx].emissiveIntensity = 0.8;
                        dodecahedron.material[faceIdx].needsUpdate = true;
                    }
                    if (faceOutlines && faceOutlines[faceIdx]) {
                        faceOutlines[faceIdx].material.color.setHex(0xC48C50);
                        faceOutlines[faceIdx].material.opacity = 0.95;
                        faceOutlines[faceIdx].material.needsUpdate = true;
                    }
                });
            }
        } catch(e) {
            console.warn(":: Visited path sync missed.", e);
        }
    }

    function triggerPluckChime(faceIdx) {
        if (!audioCtx || !soundEnabled) return;
        var now = audioCtx.currentTime;
        var baseFreq = FACES[faceIdx].freq;
        var chimeFreq = baseFreq * 4.0; // Two octaves up
        
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(chimeFreq, now);
        
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.008, now + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.150);
        
        osc.connect(gain);
        if (dryGainNode) gain.connect(dryGainNode);
        if (delayNode) gain.connect(delayNode);
        
        osc.start(now);
        osc.stop(now + 0.2);
    }

    function showReflectionScroll(faceIdx) {
        var sessionStr = localStorage.getItem('bloom_current_session_v1');
        if (!sessionStr) return;
        try {
            var session = JSON.parse(sessionStr);
            if (session && session.reflections && session.reflections[faceIdx + 1]) {
                var reflectionText = session.reflections[faceIdx + 1];
                document.getElementById('scroll-chamber-info').textContent = 'Chamber ' + FACES[faceIdx].num + ' · ' + FACES[faceIdx].name;
                document.getElementById('scroll-text').textContent = reflectionText;
                document.getElementById('reflection-scroll-overlay').classList.add('open');
            }
        } catch(e) {
            console.warn(":: Reflection read missed.", e);
        }
    }

    function closeReflectionScroll() {
        document.getElementById('reflection-scroll-overlay').classList.remove('open');
    }

    (function() {
        var booted = false;
        function boot() {
            if (booted) return;
            booted = true;
            try {
                init();
            } catch (e) {
                console.error(":: Dodecahedron Explorer Init Failed:", e);
            } finally {
                document.body.classList.add('is-loaded');
            }
        }
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            boot();
        } else {
            window.addEventListener('load', boot, { once: true });
            document.addEventListener('hdm:page-loaded', boot, { once: true });
        }
    })();

}());
</script>
